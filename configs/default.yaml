# SegTask default config (TotalSegmentator body_pred). Adjust paths/labels for your task.

data:
  image_dir: "F:/med_data/Totalsegmentator_dataset_v201/nii"
  label_dir: "F:/med_data/Totalsegmentator_dataset_v201/body_pred"
  meta_csv: "F:/med_data/Totalsegmentator_dataset_v201/meta.csv"

  image_suffix: ".nii.gz"
  label_suffix: ".nii.gz"

  # 空 => 自动检测; 此处 0=bg, 1=body, 2=extremities
  label_values: [0, 1, 2]
  num_classes: 3

  # mode: '2d' | '2.5d' (多切片作 2D 多通道) | '3d'
  mode: "2.5d"

  # 2.5D 中心切片两侧上下文切片数; 总通道数 = 2*num_slices_per_side + 1
  num_slices_per_side: 1

  # 2D/2.5D 目标 [H,W]; image 双线性/label 最近邻 resize
  target_size: [256, 256]

  patch_size: [96, 96, 96]               # 仅 mode='3d'

  intensity_min: -1024.0                 # CT HU 窗
  intensity_max: 3071.0

  normalize: "minmax"                    # 'minmax' → [0,1] | 'zscore'
  global_mean: 0.0                       # zscore 使用 (auto)
  global_std: 1.0

  target_spacing: [0.0, 0.0, 0.0]        # 0 = 保持原 spacing

  split_method: "random"                 # 'random' | 'meta' (使用 meta.csv split 列)
  val_ratio: 0.15
  test_ratio: 0.15
  split_seed: 42

  batch_size: 8
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2

  foreground_oversample_ratio: 0.5       # 前景偏重概率 (0=随机)
  class_sample_weights: []               # per-class 采样权重 (空=均匀)

  cache_mode: "none"                     # 'none' | 'memory'

# AUGMENT (GPU)
augment:
  enabled: true

  random_flip_axes: [0, 1]               # 0=H, 1=W
  random_flip_prob: 0.5

  random_rotate_prob: 0.3
  random_rotate_range: 15.0              # degrees

  random_scale_prob: 0.2
  random_scale_range: [0.85, 1.15]

  elastic_deform_prob: 0.0               # 贵, 默认关
  elastic_deform_sigma: 5.0
  elastic_deform_alpha: 100.0

  random_brightness_prob: 0.3
  random_brightness_range: [-0.1, 0.1]

  random_contrast_prob: 0.3
  random_contrast_range: [0.8, 1.2]

  random_gamma_prob: 0.2
  random_gamma_range: [0.8, 1.2]

  gaussian_noise_prob: 0.2
  gaussian_noise_std: 0.05

  gaussian_blur_prob: 0.1
  gaussian_blur_sigma: [0.5, 1.5]

  cutout_prob: 0.0                       # random erasing
  cutout_num_holes: 1
  cutout_size_ratio: [0.05, 0.15]

  mixup_prob: 0.0                        # batch-level
  mixup_alpha: 0.2

model:
  encoder_name: "resnet"                 # 'vgg' | 'resnet' | 'vit'
  decoder_name: "resnet"                 # 'vgg' | 'resnet' | 'vit'

  # spatial_dims: 2                       # auto: 2d/2.5d→2, 3d→3
  # in_channels: 3                        # auto: 从 data.mode + num_slices_per_side

  encoder_channels: [32, 64, 128, 256, 512]
  encoder_blocks_per_level: [2, 2, 2, 2, 2]

  decoder_channels: []                   # 空 => 反转 encoder
  decoder_blocks_per_level: [2, 2, 2, 2]

  bottleneck_channels: 0                 # 0 = 同最后 encoder

  norm_type: "instance"                  # 'batch' | 'instance' (small batch 友好) | 'group'
  norm_groups: 8                         # 仅 group

  activation: "leakyrelu"                # 'relu' | 'leakyrelu' | 'gelu' | 'swish'
  dropout: 0.0

  deep_supervision: false                # 多尺度 loss

  # ViT (仅 encoder/decoder='vit')
  vit_patch_size: 2
  vit_num_heads: 8
  vit_mlp_ratio: 4.0
  vit_qkv_bias: true
  vit_drop_path_rate: 0.1

  upsample_mode: "transpose"             # 'transpose' (学习) | 'bilinear'/'trilinear'
  skip_mode: "cat"                       # 'cat' | 'add'

loss:
  # 'softmax' (多类, 含 bg) | 'per_class' (每前景类独立 sigmoid)
  output_mode: "softmax"

  # 'dice' | 'ce' | 'dice_ce' | 'focal' | 'tversky' | 'dice_focal' (per_class 下 ce→BCE)
  name: "dice_ce"

  compound_weights: [1.0, 1.0]
  class_weights: []                      # 空 = 均匀

  dice_smooth: 1.0e-5
  dice_squared: false

  focal_alpha: 0.25
  focal_gamma: 2.0

  tversky_alpha: 0.3                     # FP 权重
  tversky_beta: 0.7                      # FN 权重

  label_smoothing: 0.0

  spatial_weight_mode: "none"            # 'none' | 'border' (边界加权)
  border_weight_sigma: 5.0
  border_weight_w0: 10.0

  deep_supervision_weights: [1.0, 0.5, 0.25, 0.125]

train:
  epochs: 200

  optimizer: "adamw"                     # 'adam' | 'adamw' | 'sgd'
  lr: 1.0e-3
  weight_decay: 1.0e-4

  momentum: 0.99                         # 仅 SGD
  nesterov: true

  scheduler: "cosine"                    # 'cosine' | 'poly' | 'step' | 'plateau' | 'one_cycle'

  warmup_epochs: 5
  warmup_lr: 1.0e-6

  cosine_min_lr: 1.0e-6
  poly_power: 0.9
  step_size: 50
  step_gamma: 0.1
  plateau_patience: 10
  plateau_factor: 0.5

  grad_clip_norm: 12.0
  grad_clip_value: 0.0                   # 0 = 禁用

  use_amp: true
  amp_dtype: "float16"                   # 'float16' | 'bfloat16'

  use_ema: true
  ema_decay: 0.999

  output_dir: "outputs"
  save_every: 10
  save_best_metric: "mean_dice"
  save_best_mode: "max"                  # 'max' | 'min'

  early_stopping: 0                      # 0 = 禁用

  log_every: 10
  val_every: 1
  vis_every: 10

  seed: 42
  deterministic: false

  resume: ""                             # 完整 state 恢复

  # 仅加载权重作迁移学习初始 (不恢复 optim/sched/epoch/RNG); resume 优先
  pretrain: ""
  pretrain_strict: false
  pretrain_load_ema: false

  distributed: false                     # DDP 未实现

predict:
  patch_overlap: 0.5                     # 滑窗重叠 (0~1)
  blend_mode: "gaussian"                 # 'gaussian' | 'constant'

  batch_size: 4

  tta_enabled: false
  tta_flips: true

  min_component_size: 0                  # 最小连通域 (0 = 禁用)
  fill_holes: false
  threshold: 0.5

  save_probabilities: false
  output_dir: "predictions"
