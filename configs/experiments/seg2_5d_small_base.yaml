# ============================================================================
# 2.5D 多 FOV aux 监督对照实验 — 基线（无 aux 监督，作为对照）。
# 设计：在 small_data 上跑 30 epoch，固定 seed/EMA/优化器，仅变化
# {aux_seg_supervision, context_fusion, aux_head_mode} 三个开关。
# ============================================================================

data:
  image_dir: "F:/med_data/Totalsegmentator_dataset_v201/small_data/nii"
  label_dir: "F:/med_data/Totalsegmentator_dataset_v201/small_data/mask"
  bbox_dir: "F:/med_data/Totalsegmentator_dataset_v201/small_data/bbox"
  region_weight_dir: "F:/med_data/Totalsegmentator_dataset_v201/small_data/region_weight"
  image_suffix: ".nii.gz"
  label_suffix: ".nii.gz"
  bbox_suffix: ".nii.gz"
  region_weight_suffix: ".nii.gz"

  label_values: [0, 1, 2]
  num_classes: 3

  patch_size: [12, 256, 256]
  patch_mode: "2_5d"
  multi_res_scales: [1.0, 1.5, 2.0]   # 3 views
  aug_oversample_ratio: 1.5
  z_boundary_mode: "edge_pad"

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize: "minmax"

  val_ratio: 0.25     # 12 * 0.25 = 3 val samples
  split_seed: 42
  stratified_split: true

  batch_size: 2       # patch_size large → keep batch small
  num_workers: 2
  pin_memory: true

  foreground_oversample_ratio: 0.3
  samples_per_volume: 4
  cache_mode: "memory"
  cache_max_volumes: 12

augment:
  enabled: true
  random_flip_prob: 0.5
  random_flip_axes: [2, 3, 4]
  random_affine_prob: 0.3
  random_rotate_range: [-15.0, 15.0]
  random_scale_range: [0.85, 1.15]
  random_brightness_prob: 0.3
  random_brightness_range: [-0.1, 0.1]
  random_contrast_prob: 0.3
  random_contrast_range: [0.8, 1.2]
  random_gamma_prob: 0.2
  random_gamma_range: [0.8, 1.2]
  gaussian_noise_prob: 0.2
  gaussian_noise_std: 0.05

model:
  backbone: "resnet"
  spatial_dims: 2
  encoder_channels: [32, 64, 128, 256, 512]
  blocks_per_level: 2
  block_type: "basic"
  norm_type: "instance"
  norm_groups: 8
  activation: "leakyrelu"
  dropout: 0.0
  use_se: false
  attention_type: "none"
  skip_attention: false
  deep_supervision: false
  stem_mode: "conv3"

  # === Sweep dimensions — overridden per-experiment ===
  context_fusion: "multi_stem_proj"
  aux_seg_supervision: false
  aux_head_mode: "linear"

  decoder_type: "unet"
  downsample_mode: "conv"
  upsample_mode: "trilinear"
  skip_mode: "cat"
  drop_path_rate: 0.0

loss:
  name: "dice_focal"
  compound_weights: [1.0, 1.0]
  class_weights: [1.0, 1.0]
  region_weights: [1.0, 4.0, 2.0]
  dice_smooth: 1.0e-5
  focal_alpha: 0.5
  focal_gamma: 2.0
  slice_loss_reduction: "per_volume"
  aux_supervision_weights: []   # auto 0.5^k decay

train:
  epochs: 30
  optimizer: "adamw"
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: "cosine"
  warmup_epochs: 2
  warmup_lr: 1.0e-6
  cosine_min_lr: 1.0e-6
  grad_accum_steps: 1
  grad_clip_norm: 12.0
  use_amp: true
  amp_dtype: "bfloat16"
  compile_mode: "none"
  use_ema: true
  ema_decay: 0.999

  # === Output dir overridden per-experiment ===
  output_dir: "outputs/aux_exp/baseline"
  save_every: 30
  save_best_metric: "mean_dice"
  save_best_mode: "max"
  early_stopping: 0
  log_every: 5
  val_every: 1
  vis_every: 30
  seed: 42
  deterministic: false
  resume: ""
  pretrain: ""

predict:
  z_overlap: 0.5
  blend_mode: "gaussian"
  batch_size: 2
  tta_flip: false
  threshold: 0.5
  output_dir: "predictions"
  save_probabilities: false
