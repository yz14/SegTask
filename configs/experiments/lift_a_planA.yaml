# Plan A 升维对照 2/3 — lift 3D + R(2+1)D。与 Baseline-2.5D 仅差 {block_type, lift_2_5d_to_3d}。
# lift: D 保持真空间轴; 2D UNet 重建为 3D UNet (spatial_dims=3, in_channels=n_views=3);
# loss 走 MultiResolutionLoss(1)。验 R(2+1)D + lift 的 Dice 增益 vs 显存/速度

data:
  image_dir: "F:/med_data/Totalsegmentator_dataset_v201/small_data/nii"
  label_dir: "F:/med_data/Totalsegmentator_dataset_v201/small_data/mask"
  bbox_dir: "F:/med_data/Totalsegmentator_dataset_v201/small_data/bbox"
  region_weight_dir: "F:/med_data/Totalsegmentator_dataset_v201/small_data/region_weight"
  image_suffix: ".nii.gz"
  label_suffix: ".nii.gz"
  bbox_suffix: ".nii.gz"
  region_weight_suffix: ".nii.gz"

  label_values: [0, 1, 2]
  num_classes: 3

  # lift + 5 stages 要求 D % 2^4 == 0 → D=16
  patch_size: [16, 256, 256]
  patch_mode: "2_5d"
  multi_res_scales: [1.0, 1.5, 2.0]
  aug_oversample_ratio: 1.5
  z_boundary_mode: "edge_pad"
  aux_keep_native_d: false       # 与 lift 互斥 (validate 拒绝)

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize: "minmax"

  val_ratio: 0.25
  split_seed: 42
  stratified_split: true

  batch_size: 2
  num_workers: 2
  pin_memory: true

  foreground_oversample_ratio: 0.3
  samples_per_volume: 4
  cache_mode: "memory"
  cache_max_volumes: 12

augment:
  enabled: true
  random_flip_prob: 0.5
  random_flip_axes: [2, 3, 4]
  random_affine_prob: 0.3
  random_rotate_range: [-15.0, 15.0]
  random_scale_range: [0.85, 1.15]
  random_brightness_prob: 0.3
  random_brightness_range: [-0.1, 0.1]
  random_contrast_prob: 0.3
  random_contrast_range: [0.8, 1.2]
  random_gamma_prob: 0.2
  random_gamma_range: [0.8, 1.2]
  gaussian_noise_prob: 0.2
  gaussian_noise_std: 0.05

model:
  backbone: "resnet"
  # sync() 自动: spatial_dims=3, in_channels=n_views=3
  encoder_channels: [32, 64, 128, 256, 256]
  blocks_per_level: 2

  block_type: "r2plus1d"        # 关键: 因子化 (2+1)D 残差块
  lift_2_5d_to_3d: true         # 关键: 升维真 3D

  norm_type: "instance"
  norm_groups: 8
  activation: "leakyrelu"
  dropout: 0.0
  use_se: false
  attention_type: "none"
  skip_attention: false
  deep_supervision: false
  stem_mode: "conv3"
  context_fusion: "multi_stem_proj"
  # 实验设计: 仅 view 0 监督主路径，与 lift_a_planA_aux.yaml 对比 aux 的叠加收益
  aux_seg_supervision: false
  aux_head_mode: "linear"
  decoder_type: "unet"
  downsample_mode: "conv"
  upsample_mode: "trilinear"
  skip_mode: "cat"
  drop_path_rate: 0.0

loss:
  name: "dice_focal"
  compound_weights: [1.0, 1.0]
  class_weights: [1.0, 1.0]
  region_weights: [1.0, 4.0, 2.0]
  dice_smooth: 1.0e-5
  focal_alpha: 0.5
  focal_gamma: 2.0
  slice_loss_reduction: "per_volume"  # lift 下被忽略
  aux_supervision_weights: []

train:
  epochs: 30
  optimizer: "adamw"
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: "cosine"
  warmup_epochs: 2
  warmup_lr: 1.0e-6
  cosine_min_lr: 1.0e-6
  grad_accum_steps: 1
  grad_clip_norm: 12.0
  use_amp: true
  amp_dtype: "bfloat16"
  compile_mode: "none"
  use_ema: true
  ema_decay: 0.999

  output_dir: "outputs/lift_a/planA_lift_r2plus1d"
  save_every: 30
  save_best_metric: "mean_dice"
  save_best_mode: "max"
  early_stopping: 0
  log_every: 5
  val_every: 1
  vis_every: 30
  seed: 42
  deterministic: false
  resume: ""
  pretrain: ""

predict:
  z_overlap: 0.5
  blend_mode: "gaussian"
  batch_size: 2
  tta_flip: false
  threshold: 0.5
  output_dir: "predictions"
  save_probabilities: false
