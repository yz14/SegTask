# Plan A 升维对照 3/3 — 原生 z_axis 3D 多分辨率 (上限参照)。
# spatial_dims=3, C_res=3, 输出 (B, num_fg*3, D, H, W)。以同量多 FOV 对照 lift+r2plus1d

data:
  image_dir: "F:/med_data/Totalsegmentator_dataset_v201/small_data/nii"
  label_dir: "F:/med_data/Totalsegmentator_dataset_v201/small_data/mask"
  bbox_dir: "F:/med_data/Totalsegmentator_dataset_v201/small_data/bbox"
  region_weight_dir: "F:/med_data/Totalsegmentator_dataset_v201/small_data/region_weight"
  image_suffix: ".nii.gz"
  label_suffix: ".nii.gz"
  bbox_suffix: ".nii.gz"
  region_weight_suffix: ".nii.gz"

  label_values: [0, 1, 2]
  num_classes: 3

  patch_size: [16, 256, 256]    # 三组共用 (z_axis 3D 无 lift 几何约束)
  patch_mode: "z_axis"          # 关键: 原生 3D z_axis 滑块
  multi_res_scales: [1.0, 1.5, 2.0]
  aug_oversample_ratio: 1.5
  z_boundary_mode: "edge_pad"
  keep_native_multi_res: false

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize: "minmax"

  val_ratio: 0.25
  split_seed: 42
  stratified_split: true

  batch_size: 2
  num_workers: 2
  pin_memory: true

  foreground_oversample_ratio: 0.3
  samples_per_volume: 4
  cache_mode: "memory"
  cache_max_volumes: 12

augment:
  enabled: true
  random_flip_prob: 0.5
  random_flip_axes: [2, 3, 4]
  random_affine_prob: 0.3
  random_rotate_range: [-15.0, 15.0]
  random_scale_range: [0.85, 1.15]
  random_brightness_prob: 0.3
  random_brightness_range: [-0.1, 0.1]
  random_contrast_prob: 0.3
  random_contrast_range: [0.8, 1.2]
  random_gamma_prob: 0.2
  random_gamma_range: [0.8, 1.2]
  gaussian_noise_prob: 0.2
  gaussian_noise_std: 0.05

model:
  backbone: "resnet"
  spatial_dims: 3               # 原生 3D (sync 不会改, patch_mode='z_axis' 不参与 2.5D 逻辑)
  encoder_channels: [32, 64, 128, 256, 256]
  blocks_per_level: 2
  block_type: "basic"           # 标准 3D 残差 (非 r2plus1d)
  lift_2_5d_to_3d: false        # 3D 模式下 no-op

  norm_type: "instance"
  norm_groups: 8
  activation: "leakyrelu"
  dropout: 0.0
  use_se: false
  attention_type: "none"
  skip_attention: false
  deep_supervision: false
  stem_mode: "conv3"
  # context_fusion 在 3D 模式下忽略 (stem 直接吃 n_views 通道)
  decoder_type: "unet"
  downsample_mode: "conv"
  upsample_mode: "trilinear"
  skip_mode: "cat"
  drop_path_rate: 0.0

loss:
  name: "dice_focal"
  compound_weights: [1.0, 1.0]
  class_weights: [1.0, 1.0]
  region_weights: [1.0, 4.0, 2.0]
  dice_smooth: 1.0e-5
  focal_alpha: 0.5
  focal_gamma: 2.0

train:
  epochs: 30
  optimizer: "adamw"
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: "cosine"
  warmup_epochs: 2
  warmup_lr: 1.0e-6
  cosine_min_lr: 1.0e-6
  grad_accum_steps: 1
  grad_clip_norm: 12.0
  use_amp: true
  amp_dtype: "bfloat16"
  compile_mode: "none"
  use_ema: true
  ema_decay: 0.999

  output_dir: "outputs/lift_a/ref_3d_zaxis"
  save_every: 30
  save_best_metric: "mean_dice"
  save_best_mode: "max"
  early_stopping: 0
  log_every: 5
  val_every: 1
  vis_every: 30
  seed: 42
  deterministic: false
  resume: ""
  pretrain: ""

predict:
  z_overlap: 0.5
  blend_mode: "gaussian"
  batch_size: 2
  tta_flip: false
  threshold: 0.5
  output_dir: "predictions"
  save_probabilities: false
