# 3D 分割 reference 配置。注释掉的字段用 dataclass 默认 (见 segtask_v1/config.py)。
# 用法: python -m segtask_v1.train --config configs/seg3d.yaml [--override key=val ...]

data:
  # NIfTI 路径。image / label 文件名必须一致
  image_dir: "F:/BaiduNetdiskDownload/lung_nii"
  label_dir: "F:/BaiduNetdiskDownload/lung_bone"
  bbox_dir : "F:/CT_data/airway_segment_data/bone_bbox"            # F:/BaiduNetdiskDownload/bone_bbox
  region_weight_dir: "F:/BaiduNetdiskDownload/lung_weight"  # 
  image_suffix: ".nii.gz"
  label_suffix: ".nii.gz"
  bbox_suffix : ".nii.gz"
  region_weight_suffix: ".nii.gz"
  npz_dir: "F:/BaiduNetdiskDownload/lung_prep"

  # label 整数值，[bg, fg1, fg2, ...]。空 => 首运自动检测。例: [0,1,2]
  label_values: [0, 1, 2]
  num_classes : 3          # 0 => 自动 = len(label_values)

  patch_size: [32, 256, 256]            # [D, H, W]

  # patch_mode — 训练样本抽取方式:
  #   'z_axis' — 沿 z 轴滑块；x,y resize 到 (pH,pW)。支持 multi_res (仅 z)
  #   'cubic'  — 中心点抽 3D cube。支持 multi_res (3 轴同比)
  #   'whole'  — 整卷 resize 到 patch_size。multi_res 必须 [1.0]
  #   '2_5d'   — 见 configs/seg2_5d.yaml
  patch_mode: "z_axis"

  # 增强 oversample: 先抽较大 patch 增强后中心 crop 回 patch_size, 抵消黑边角。
  # z_axis 仅 z；cubic/whole 三轴同比。开 affine/elastic 时设 1.3~1.5，否则 1.0
  aug_oversample_ratio: 1.5

  # 多分辨率输入 (多 FOV)。[1.0] 单分辨率；[1.0,1.5,2.0] 多分辨率 (3 通道)。whole 必须 [1.0]
  multi_res_scales: [1.0]

  # 3D 多分辨率 lazy 单 cube 提取 (仅 z_axis/cubic + n>1)。
  #   false — 默认: 每 scale 独立 scipy.zoom; aux 高频细节在增强前已损
  #   true  — 只抽 max-FOV cube 增强 1 次，trainer per-view crop+interpolate; 锁 edge_pad; 与 aux_keep_native_d 互斥
  keep_native_multi_res: false

  # HU 窗 + 归一化。normalize: 'minmax' → [0,1] | 'zscore' → (x-mean)/std (需 global_mean/std)
  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize: "minmax"
  # global_mean: 0.0
  # global_std : 1.0

  val_ratio : 0.2
  split_seed: 42
  # stratified_split: true   # 按主要前景类分层; 太小自动 fallback 随机

  batch_size : 2
  num_workers: 4
  pin_memory : true

  foreground_oversample_ratio: 0.3       # 前景中心采样概率 (whole 忽略)
  samples_per_volume: 8                  # 每卷每 epoch 样本数

  cache_mode: "memory"                   # 'none' | 'memory' (LRU 缓存已解码体数据)
  cache_max_volumes: 1                   # 0 = 不限 (可能 OOM)


# AUGMENT — GPU-side per-sample augmentation
augment:
  enabled: true

  random_flip_prob: 0.5
  random_flip_axes: [2, 3, 4]            # 2=D, 3=H, 4=W (相对 B,C,D,H,W)

  # affine = rotate+scale, 同一次 grid_sample
  random_affine_prob : 0.3
  random_rotate_range: [-30.0, 30.0]     # degrees
  random_scale_range : [0.65, 1.25]

  # B-spline 位移场; sigma 平滑度 (3~7); alpha 幅度 (1~10, 体素)
  elastic_deform_prob : 0.02
  elastic_deform_sigma: 5.0
  elastic_deform_alpha: 1.0

  # 随机挖掉矩形块 (强正则)
  grid_dropout_prob : 0.0
  grid_dropout_ratio: 0.3
  grid_dropout_holes: 4

  random_brightness_prob : 0.3
  random_brightness_range: [-0.1, 0.1]   # 加性

  random_contrast_prob : 0.3
  random_contrast_range: [0.8, 1.2]      # 乘性

  random_gamma_prob : 0.2
  random_gamma_range: [0.8, 1.2]

  gaussian_noise_prob: 0.2
  gaussian_noise_std : 0.1

  gaussian_blur_prob : 0.1
  gaussian_blur_sigma: [0.5, 1.5]

  # 降采后插值回原分辨率
  simulate_lowres_prob: 0.1
  simulate_lowres_zoom: [0.5, 1.0]


# MODEL — UNet3D
model:
  backbone: "resnet"                     # 'resnet' | 'convnext'

  in_channels: 1                         # = len(multi_res_scales), sync() 自动同步

  encoder_channels: [32, 64, 128, 256, 256]   # 长 = 层数 (下采样次数+1)
  blocks_per_level: 2                    # 默认每级 block 数

  # block_type (resnet): 'basic'(默认) | 'preact'(深) | 'bottleneck'(ResEnc-XL) | 'r2plus1d'(需 3D, z 上下文)
  block_type: "basic"

  # 非对称每级 block 数; 长度 = len(encoder_channels) [decoder = -1]
  # encoder_blocks_per_stage: []
  # decoder_blocks_per_stage: []

  # ResEnc 预设: 'none' | 'S' | 'M' | 'L' | 'XL'。非 none 且上面两列空时 sync() 自动填
  # resenc_preset: "none"

  # 'batch' | 'instance' | 'group'
  # 'group' 相较 'instance':
  #   (1) 不抹掉每 channel 的绝对强度尺度 → 保留 HU 信号 → 与 region_weight
  #       (按 HU 区域加权) 的设计哲学兼容；
  #   (2) 组内多通道联合统计 → 跨通道相对响应保留 → 利于深层 z-axis 上下文学习。
  # resnet/basic backbone 下此设置作用于全网络。
  norm_type  : "group"
  norm_groups: 8                         # 仅 group norm

  activation: "leakyrelu"                # 'relu' | 'leakyrelu' | 'gelu' | 'swish'
  dropout   : 0.0

  use_se      : false                    # legacy; 优先用 attention_type
  se_reduction: 16
  # attention_type: "none"                # 'none' | 'se' | 'eca' | 'cbam' | 'coord'
  # skip_attention: false                 # Skip 路 AttentionGate3D (Oktay 2018)

  deep_supervision: false                # 多 decoder 层预测; 权重见 loss.deep_supervision_weights

  # 'conv3' | 'conv7' | 'dual' | 'patch2' | 'patch4' (patchN 降 N 倍, 输出补 trilinear)
  stem_mode: "conv3"

  decoder_type: "unet"                   # 'unet' | 'unetpp' | 'unet3p'
  unet3p_cat_channels: 64                # 仅 unet3p

  # 'conv'(默认) | 'maxpool' | 'avgpool' | 'blurpool' | 'pixelunshuffle'
  downsample_mode: "conv"
  # 'transpose' | 'trilinear'(默认) | 'nearest' | 'pixelshuffle' | 'carafe' | 'dysample'
  upsample_mode: "trilinear"

  # 各向异性下采样: 薄 z 轴(此处 patch z=32 << H/W=256)各向同性 ×2 会被压成 2,
  # 深层几乎无 z 上下文(退化成准 2D)。开启后按 patch_size 自动推导逐级 per-axis stride,
  # 让各轴分辨率保持彼此 2x 以内(nnU-Net 思路)。本配置 [32,256,256]/5 级 自动得:
  #   [[1,2,2],[1,2,2],[1,2,2],[2,2,2]] → bottleneck z=16 (各向同性则为 2)。
  # 仅支持 decoder_type='unet' + downsample_mode∈{conv,maxpool,avgpool}
  #        + upsample_mode∈{transpose,trilinear,nearest} + 非 ConvNeXt LN-first 下采样。
  anisotropic_pooling: true
  # 显式覆盖自动推导(非空时优先): 长度=len(encoder_channels)-1, 每项长度=spatial_dims, 值∈{1,2}。
  # downsample_strides: [[1,2,2],[1,2,2],[1,2,2],[2,2,2]]

  skip_mode: "cat"                       # 'cat' | 'add'

  drop_path_rate: 0.0                    # 仅 convnext


# LOSS
loss:
  # 单独: 'dice' | 'bce' | 'focal' | 'tversky' | 'gdl' | 'focal_tversky' | 'lovasz' | 'cldice'
  # 复合: 'dice_bce' | 'dice_focal' | 'dice_tversky' | 'focal_plus_tversky' | 'dice_cldice'
  #       | 'dice_focal_tversky' | 'dice_lovasz' | 'bce_lovasz' | 'gdl_bce' | 'gdl_focal'
  # 说明: gdl 自动体积倒数加权(不平衡首选); focal_tversky 小病灶友好;
  #       lovasz IoU 梯度替代; cldice 拓扑保持 (血管/气道), 建议与 Dice 组合
  name: "dice_focal"

  compound_weights: [1.0, 1.0]           # [loss1_w, loss2_w] 仅 compound 使用

  class_weights: [1.0, 1.0]              # 按前景类; 长度 = num_fg_classes (空 = 均匀)

  # 按 label_values 逐值 (含 bg)。例: [0,1,2]+[1,2,1] => label=1 体素 loss 权重 2。空 = 禁用
  region_weights: [1.0, 2.0, 1.0]

  dice_smooth : 1.0e-5                   # 防 0/0
  dice_squared: false                    # true → Dice^2 (稳但梯度弱)

  focal_alpha: 0.5                       # 正类权重
  focal_gamma: 2.0                       # 难样本指数

  # Tversky: alpha=FP, beta=FN。alpha=beta=0.5 等价 Dice; 召回优先: alpha<beta (如 0.3/0.7)
  tversky_alpha: 0.3
  tversky_beta : 0.7

  # batch_dice: true → nnU-Net 默认 batch+空间聚合 (稀疏更稳); false → per-sample-class。GDL 总是 true
  # batch_dice: false
  # ignore_empty: false                    # 仅 per-sample; 跳过缺失前景类避免 dice=1 假象

  # gdl_weight_type: "square" | "simple" | "uniform"  # Sudre 原论 'square'
  # gdl_w_max: 1.0e5                       # 1/volume 上限, 防空类爆炸

  # focal_tversky_gamma: 1.3333            # (1-TI)^gamma, gamma≥1; 默认 4/3 ≈ 原论 γ=0.75
  # lovasz_per_sample: true                # true=per (B,C); false=channel 级 (tiny patch 更稳)
  # cldice_iter : 3                        # 软骨架化迭代次数 (2D=3, 3D 细血管 5~10)
  # cldice_smooth: 1.0

  # Deep supervision 每层权重 (浅→深衰减); 需 model.deep_supervision=true; 长 ≤ decoder 层数
  deep_supervision_weights: [1.0, 0.5, 0.25, 0.125]


train:
  epochs: 50

  optimizer   : "adamw"                  # 'adam' | 'adamw' | 'sgd'
  lr          : 1.0e-3
  weight_decay: 1.0e-4
  # momentum: 0.99                         # 仅 SGD
  # nesterov: true

  # scheduler: 'cosine' | 'cosine_warm_restarts' | 'poly' | 'step' | 'plateau' | 'one_cycle'
  scheduler: "cosine"

  warmup_epochs: 5                       # one_cycle 下必须 0 (内置 pct_start)
  warmup_lr    : 1.0e-6

  cosine_min_lr        : 1.0e-6
  cosine_restart_period: 50              # T_0 (epochs)
  cosine_restart_mult  : 2               # T_mult

  # poly_power: 0.9
  # step_size: 50                          # MultiStepLR
  # step_gamma: 0.1
  # plateau_patience: 10
  # plateau_factor  : 0.5

  grad_accum_steps: 1                    # 等效 batch = batch_size * grad_accum_steps
  grad_clip_norm: 12.0                   # 0 = 禁用

  use_amp: true
  # 'float16'/'fp16' (需 GradScaler) | 'bfloat16'/'bf16' (无需 scaler, 稳定)
  amp_dtype: "bfloat16"

  # torch.compile (PT2+): 'none' | 'default' | 'reduce-overhead' | 'max-autotune'
  compile_mode: "none"

  use_ema  : true
  ema_decay: 0.999

  output_dir: "outputs/lung_bone_zaxis"
  save_every: 10
  save_best_metric: "mean_dice"
  save_best_mode: "max"                  # 'max' | 'min'

  early_stopping: 15                     # 0 = 禁用

  log_every: 10                          # 训练 loss 记录 (micro-step)
  val_every: 1
  vis_every: 10

  seed: 42
  deterministic: false                   # cudnn deterministic (慢)

  resume: ""                             # 完整 state 恢复 (model/optim/sched/ema/rng)

  # 仅加载权重 作初始 (迁移学习); resume 优先
  pretrain: ""
  pretrain_strict: false                 # false 允许 head 形状不一致
  pretrain_load_ema: false               # ckpt 含 EMA 时是否优先取 shadow


predict:
  # 滑窗重叠 (0~0.95)。z_axis: 沿 z; cubic: 三轴同值; whole: 忽略
  z_overlap: 0.5
  blend_mode: "gaussian"                 # 'gaussian'(推荐) | 'average'

  batch_size: 2                          # 推理 batch (可大于训练)

  tta_flip: false                        # 8× forward, +0.3~1.0 mDice

  # 前景类最大概率 < threshold 的体素归背景 (label_values[0])
  threshold: 0.5
  output_dir: "predictions"
  save_probabilities: false              # 同时保存每前景类概率图

