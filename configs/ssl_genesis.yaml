# 自监督预训练（SSL, Models Genesis 式重建）示例配置。
# 运行：  python -m segtask_v1.pretrain --config configs/ssl_genesis.yaml
# 产出：  outputs/ssl_genesis/ssl_best.pt
# 衔接：  分割训练加 --override train.pretrain=outputs/ssl_genesis/ssl_best.pt
#         分割侧 _load_pretrain 非严格加载：encoder.*/decoder.* 命中，seg head 随机。
#
# 重要：要让权重 1:1 迁移，下游分割 config 的 `model:` 段（backbone/encoder_channels/
#       blocks/stem/norm/down-up/skip 等几何项）应与本文件一致。aux/深监督/topo 头
#       在 SSL 阶段被丢弃（仅预训练 encoder+decoder），分割侧可自由开启。
#
# SSL 走单视图重建：data.multi_res_scales 必须为 [1.0]（见 config._validate_ssl）。

data:
  image_suffix: ".nii.gz"
  label_suffix: "-seg.nii.gz"          # SSL 忽略 label，仅取 image patch
  bbox_suffix : "_pred.nii.gz"
  region_weight_suffix: ".nii.gz"

  image_dir: "F:/LUNA25/imgs"          # 可指向更大的无标注肺 CT 池（SSL 价值来源）
  bbox_dir : "F:/LUNA25/lung_base"

  label_values: [0, 1]
  num_classes : 2

  patch_size: [96, 112, 112]
  patch_mode: "cubic"

  multi_res_scales    : [1.0]          # SSL 单视图（必须长度 1）
  aug_oversample_ratio: 1.0            # SSL 不做分割增强；破坏由 Genesis 完成

  z_boundary_mode: "edge_pad"

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio       : 0.2
  split_seed      : 42
  stratified_split: true

  batch_size     : 2
  num_workers    : 16
  prefetch_factor: 8
  pin_memory     : true

  foreground_oversample_ratio: 0.0     # 无标注预训练用均匀采样更合理
  samples_per_volume         : 8

  cache_mode       : "memory"
  cache_max_volumes: 24


# SSL 阶段不使用分割增强（Genesis 破坏取而代之），保持默认即可。
augment:
  enabled: false


model:
  backbone: "resnet"
  encoder_channels: [64, 64, 128, 256, 512]
  encoder_blocks_per_stage: [2, 2, 2, 2, 2]
  decoder_blocks_per_stage: [2, 2, 2, 2]
  block_type: "basic"

  norm_type  : "instance"
  norm_groups: 8
  activation : "leakyrelu"
  dropout    : 0.0

  attention_type: "none"
  skip_attention: true

  # 以下头在 SSL 阶段被丢弃（仅预训练 encoder+decoder）；列出以便与下游分割对齐。
  deep_supervision   : false
  aux_seg_supervision: false
  aux_topo_head      : false

  stem_mode      : "conv3"
  decoder_type   : "unet"
  downsample_mode: "conv"
  upsample_mode  : "trilinear"
  skip_mode      : "cat"


# 优化器/调度器/AMP/EMA/output_dir/epochs/lr 由 SSL 复用。
train:
  epochs: 200

  optimizer   : "adamw"
  lr          : 1.0e-3
  weight_decay: 1.0e-4

  scheduler    : "cosine"
  warmup_epochs: 5
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6

  grad_accum_steps: 4
  grad_clip_norm  : 12.0

  use_amp  : false
  amp_dtype: "auto"

  compile_mode: "none"

  use_ema  : true
  ema_decay: 0.999

  output_dir: "outputs/ssl_genesis"

  log_every: 10

  seed: 42
  deterministic: false


ssl:
  enabled: true
  method : "genesis"
  recon_loss: "l1"

  nonlinear_prob     : 0.9            # 非线性强度变换（学 HU/对比剂不变性）
  local_shuffle_prob : 0.5
  local_shuffle_blocks   : 100
  local_shuffle_max_block: [4, 8, 8]
  paint_prob      : 0.9              # 内/外补全
  inner_paint_prob: 0.5
  paint_count     : 5
  paint_block_range: [0.1, 0.25]

  save_every: 10
