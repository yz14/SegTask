# 3D 厚层→薄层超分（生成任务）— z 轴帧插值（VFI）回归复原
#
# TODO #1（1a）：CT 「厚层→薄层」的帧插值（VFI）支路。输入取稀疏 z 切片
# （厚层间距），线性插值填回原层数作天真 baseline，模型补足中间薄层。
# 与 gensr_3d_zaxis_regression.yaml 的区别仅在 task.sr_sampling="decimate"。
#
# 关键：task.type='generation' + task.algorithm='regression' + 3D patch_mode。
# task.sr_scale_per_axis=[s_z,1,1] 指定仅 z 轴退化；sr_sampling="decimate" 走抽稀+插值。

data:
  image_suffix: ".nii.gz"
  label_suffix: ".nii.gz"

  # 训练 / 推理目录（按本机修改）
  image_dir: "F:/med_data/imgs"
  label_dir: "F:/med_data/lbls"   # 生成任务忽略标签，但 loader 仍需该字段

  label_values: [0, 1]
  num_classes : 2

  patch_size: [32, 256, 256]      # [D, H, W]
  patch_mode: "z_axis"            # 沿 z 轴滑块，保留 x,y 全分辨率上下文

  # 生成任务单视图：multi_res_scales 必须为 [1.0]
  multi_res_scales: [1.0]
  aug_oversample_ratio: 1.0

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio : 0.2
  split_seed: 42

  batch_size : 2
  num_workers: 4
  pin_memory : true

  samples_per_volume: 8
  cache_mode: "memory"
  cache_max_volumes: 1

model:
  arch                    : "unet"
  encoder_channels        : [32, 64, 128, 256]
  encoder_blocks_per_stage: [2, 2, 2, 2]

  unet:
    backbone    : "resnet"
    decoder_type: "unet"
# ---- 生成任务设置 ----
task:
  type: "generation"
  algorithm: "regression"
  degradation: "superres"
  out_channels: 1

  # z 轴帧插值（VFI）：仅 z 轴抽稀 2x，再线性插值填回。x,y 保持原分辨率。
  sr_scale_per_axis: [2, 1, 1]
  sr_sampling: "decimate"       # 抽稀帧 + 线性插值（VFI）；blur 则为降采样模糊（SISR）
  sr_noise_std: 0.0

  # 回归算法
  residual: false
  recon_loss: "charbonnier"
  charbonnier_eps: 1.0e-3
  ssim_weight: 0.1
  grad_weight: 0.0

train:
  epochs: 100
  optimizer   : "adamw"
  lr          : 2.0e-4
  weight_decay: 1.0e-4
  scheduler: "cosine"
  warmup_epochs: 5
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6
  grad_clip_norm: 1.0
  use_amp  : true
  amp_dtype: "auto"
  compile_mode: "none"
  use_ema  : true
  ema_decay: 0.999
  output_dir: "outputs/gensr_zaxis_vfi"
  log_every: 20
  seed: 42


predict:
  output_dir: "predictions_sr_zaxis_vfi"
