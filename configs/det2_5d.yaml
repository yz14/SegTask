# 2.5D 检测 reference 配置（slab 折叠 → 2D 框 → 推理跨层拼接 3D 框）。
# 用法: python -m dettask.train --config configs/det2_5d.yaml [--override key=val ...]
# 说明: patch_mode=2_5d + multi_res_scales=[1.0] => in_channels=D, spatial_dims=2。
#   框真值只存 3D 一份（npz 'boxes' (N,7)=[z1,y1,x1,z2,y2,x2,cls] 或 mask 派生），
#   slab 内 2D 框自动切片派生；推理端逐 slab 检出 → stitching 拼 3D 框 → FROC。

data:
  npz_suffix : ".npz"
  npz_dir    : "F:/LUNA25/det_npz"
  npz_auto_build: false

  label_values: [0, 1]

  patch_size: [12, 256, 256]   # 2.5D: D=切片数=in_channels
  patch_mode: "2_5d"
  multi_res_scales: [1.0]
  z_boundary_mode: "edge_pad"

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio : 0.2
  split_seed: 42

  batch_size        : 4
  num_workers       : 4
  pin_memory        : true
  persistent_workers: true
  prefetch_factor   : 4
  foreground_oversample_ratio: 0.5
  samples_per_volume         : 8

augment:
  enabled: false

model:
  encoder_channels        : [32, 64, 128, 256]
  encoder_blocks_per_stage: [2, 2, 2, 2]
  stem_mode               : "conv3"

  unet:
    backbone  : "resnet"
    block_type: "basic"
    norm_type : "instance"
    activation: "leakyrelu"
train:
  epochs: 50
  optimizer   : "adamw"
  lr          : 1.0e-4
  weight_decay: 1.0e-4
  scheduler    : "cosine"
  warmup_epochs: 2
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6
  grad_clip_norm: 12.0
  prefetch_to_gpu: false        # 独立 CUDA stream 提前一个 batch 上卡（同 seg/cls）
  use_amp  : true
  amp_dtype: "auto"
  use_ema  : true
  ema_decay: 0.999
  output_dir: "outputs/det2_5d"

det:
  arch          : "retinanet"    # retinanet | fcos | faster_rcnn | detr
  boxes_from_mask: true
  stratify_split : true          # 按逐卷类存在集合分层划分 train/val
  fpn_channels  : 128
  fpn_levels    : []             # 空=decoder 全部层
  anchor_ratios : [0.5, 1.0, 2.0]
  anchor_scales : [1.0, 1.26, 1.587]
  assigner      : "iou"
  pos_iou       : 0.4
  neg_iou       : 0.3
  reg_loss      : "giou"
  score_thresh  : 0.05
  nms_iou       : 0.3
  max_dets      : 50
  stitch_link_iou: 0.3           # 跨 slab 链接 IoU（小病灶召回权衡点）
  stitch_min_span: 2
  eval_iou_thresh: 0.1           # 医学小目标命中口径
  # pretrained_ckpt: "outputs/ssl_2_5d/ssl_best.pt"
  encoder_lr_mult : 1.0
  save_best_metric: "map"
