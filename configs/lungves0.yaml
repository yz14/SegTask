data:
  image_suffix: ".nii.gz"
  label_suffix: "-seg.nii.gz"
  bbox_suffix : "_pred.nii.gz"
  region_weight_suffix: "-seg.nii.gz"

  image_dir: "F:/lung_paired/imgs"
  bbox_dir : "F:/lung_paired/lung_resnet_bnorm_pred"

  label_values: [0, 1]
  num_classes : 2

  patch_size: [12, 320, 400]  ##################################################################
  patch_mode: "2_5d"          ##################################################################

  multi_res_scales    : [1.0, 1.5, 2.0]
  aug_oversample_ratio: 1.5

  z_boundary_mode: "edge_pad"

  keep_native_view_depth: true

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio       : 0.2
  split_seed      : 42
  stratified_split: true

  batch_size     : 4
  num_workers    : 8
  prefetch_factor: 8
  pin_memory     : true

  foreground_oversample_ratio: 0.5
  samples_per_volume         : 8

  cache_mode       : "memory"
  cache_max_volumes: 12


augment:
  enabled: true

  random_flip_prob: 0.2
  random_flip_axes: [2, 3, 4]

  random_affine_prob : 0.3
  random_rotate_range: [-20.0, 20.0]
  random_scale_range : [0.80, 1.2]

  elastic_deform_prob : 0.0
  elastic_deform_sigma: 5.0
  elastic_deform_alpha: 1.0

  random_brightness_prob : 0.3
  random_brightness_range: [-0.1, 0.1]

  random_contrast_prob : 0.3
  random_contrast_range: [0.8, 1.2]

  random_gamma_prob : 0.2
  random_gamma_range: [0.8, 1.2]

  gaussian_noise_prob: 0.2
  gaussian_noise_std : 0.09

  gaussian_blur_prob : 0.2
  gaussian_blur_sigma: [0.5, 1.5]

  simulate_lowres_prob: 0.2
  simulate_lowres_zoom: [0.5, 1.0]


model:
  encoder_channels        : [64, 128, 256, 512, 512]
  encoder_blocks_per_stage: [2, 2, 2, 2, 2]
  decoder_blocks_per_stage: [2, 2, 2, 2]
  dropout                 : 0.0

  deep_supervision        : true

  stem_mode               : "dual"

  stem_fusion_mode        : "multi_stem_proj"

  aux_seg_supervision     : true

  aux_head_mode           : "conv"

  unet:
    backbone         : "resnet"
    block_type       : "basic"

    lift_2_5d_to_3d  : false

    norm_type        : "batch"  # 'instance' | 'batch' | 'group'
    norm_groups      : 8
    activation       : "leakyrelu"  # 'leakyrelu' | 'gelu' | 'relu'
    attention_type   : "none"
    skip_attention   : false

    drop_path_rate   : 0.0

    decoder_type     : "unet"  # 'unet' | 'unetpp' | 'unet3p'
    downsample_mode  : "conv"  # 'conv' (学习) | 'maxpool'
    upsample_mode    : "trilinear"  # 'transpose' (学习) | 'trilinear'
    upsample_norm_act: true
    skip_mode        : "cat"  # 'cat' | 'add'

    drop_path_rate   : 0.0
    multirf:

      # ---- 多感受野（空洞卷积多分支融合）MultiRF 示例 ----
      # 推荐起点：只在编码器深层+瓶颈开（高 ROI、低网格风险），split 等成本、concat_proj 融合、
      # axes=hw 只在 H/W 膨胀（肺 CT z 各向异性）。先验证有效再往更多 stage / 解码器铺开。
      enabled        : true
      dilations      : [1, 2, 3]  # 必须含 1（守门支路）
      mode           : "split"  # 'split'(≈等成本) | 'parallel'(≈N×)
      fusion         : "concat_proj"  # 'concat_proj' | 'sum'(需 parallel) | 'se'
      axes           : "hw"  # 'hw'(保 z, 推荐) | 'all'
      encoder_stages : [0, 1, 1, 1, 1]  # 编码器逐 stage；浅→深，末位=bottleneck
      decoder_stages : [1, 1, 1, 0]  # 解码器逐 level；深→浅
      branch_norm_act: true
seg:
  loss:
    name: "dice_focal"            # Dice + Soft clDice（Shit+ CVPR'21）：保拓扑/连通，细血管断裂更敏感
    compound_weights: [1.0, 1.0]

    class_weights : [1.0]       # 长度 = 前景类数 (不含 bg)
    region_weights: [1.0, 5.0]  # 按 label_values 全长 (含 bg)

    dice_smooth : 1.0e-5
    dice_squared: false
    batch_dice  : true             # 全 batch 汇总 TP/分母（nnU-Net Dice）：稀疏前景下梯度更稳

    cldice_iter  : 3               # 2D 软骨架迭代（Shit+ 推荐 2D 用 3）
    cldice_smooth: 1.0

    focal_alpha: 0.5
    focal_gamma: 2.0

    tversky_alpha: 0.3
    tversky_beta : 0.7

    deep_supervision_weights: [1.0, 0.5, 0.25, 0.125]

    slice_loss_reduction: "per_volume"

    aux_supervision_weights: [0.5, 0.5]


  predict:
    z_interleave_enabled   : false
    z_interleave_thresholds: [0.8, 1.2, 1.6, 2.0]
    z_interleave_factors   : [5, 4, 3, 2, 1]
    z_overlap : 0.5
    blend_mode: "gaussian"          # 'gaussian' | 'constant'
    batch_size: 2
    tta_flip  : true
    threshold : 0.5
    output_dir: ""
    save_probabilities: false


train:
  epochs: 1000
  
  # ---- 多卡 DDP ----
  gpus: [1,3,4,5,7]                         # 要用的物理卡号列表（你 8 卡 4090 混用机，按需选空闲卡）
  ddp_find_unused_parameters: true  # 深监督/多头默认 true 保正确；确认全参每步参与可设 false 提一点速
  ddp_master_port: 0                # 0=自动挑空闲端口（混用机避免端口冲突）；也可固定如 29501
 
  val_every: 1  

  optimizer   : "adamw"
  lr          : 1.0e-4
  weight_decay: 1.0e-4

  scheduler    : "cosine"
  warmup_epochs: 5
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6

  grad_accum_steps: 2
  grad_clip_norm  : 12.0

  use_amp  : true
  amp_dtype: "auto"

  compile_mode: "none"

  use_ema  : true
  ema_decay: 0.999

  output_dir      : "outputs/ves_multirf2d_mmore"    ############################################################
  save_every      : 10
  save_best_criterion: ""
  surface_dice_tolerance: 1
  surface_dice_weight: 0.5
  save_best_preset: "vessel"
  val_metric_mode: "high"

  early_stopping: 0

  log_every: 10
  val_every: 1
  vis_every: 10

  seed: 42
  deterministic: false

  resume: ""

  pretrain: ""
  pretrain_strict: false
  pretrain_load_ema: false

vis:
  enabled          : false                 # 设 true 即生成 HTML
  output_dir       : ""                    # 空 => train.output_dir/visualization/
  filename         : "pipeline_vis.html"
  flows            : ["data", "model", "predict"]   # 视图子集 + 标签页顺序
  trace_shapes     : true                  # 模型流 dummy 前向追踪真实形状
  max_detail_params: 200                   # 单节点详情最多条数


monitor:
  enabled            : false                 # 设 true 即落盘 + 渲染仪表盘
  output_dir         : ""                   # 空 => train.output_dir（HTML 落此，数据落其 monitor/）
  filename           : "training_monitor.html"
  update_every       : 1                    # 每多少 epoch 重渲染（best/末轮总会刷新）
  auto_reload_seconds: 10                   # 训练中 HTML 自动重载间隔（秒）
  run_name           : ""                   # 对比页显示名；空 => output_dir 目录名