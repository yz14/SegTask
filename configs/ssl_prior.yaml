# 自监督预训练（SSL, 经典先验自蒸馏 / Frangi vesselness 回归）示例配置。
# 运行：  python -m segtask_v1.pretrain --config configs/ssl_prior.yaml
# 产出：  outputs/ssl_prior/ssl_best.pt
# 衔接：  分割训练加 --override train.pretrain=outputs/ssl_prior/ssl_best.pt
#
# 思路：从原始 CT 直接算出"管状结构置信图"（Frangi vesselness，免标注），让网络回归它。
#       把"什么是血管"的经典几何先验灌进 encoder/decoder，直击分割 precision 短板。
#       与 method=genesis（破坏→重建）正交，可分别预训练后各自衔接对比。
#
# 同 ssl_genesis：单视图（multi_res_scales=[1.0]），model 段应与下游分割一致以 1:1 迁移。

data:
  image_suffix: ".nii.gz"
  label_suffix: "-seg.nii.gz"          # SSL 忽略 label
  bbox_suffix : "_pred.nii.gz"
  region_weight_suffix: ".nii.gz"

  image_dir: "F:/LUNA25/imgs"
  bbox_dir : "F:/LUNA25/lung_base"

  label_values: [0, 1]
  num_classes : 2

  patch_size: [96, 112, 112]
  patch_mode: "cubic"

  multi_res_scales    : [1.0]
  aug_oversample_ratio: 1.0

  z_boundary_mode: "edge_pad"

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio       : 0.2
  split_seed      : 42
  stratified_split: true

  batch_size     : 2
  num_workers    : 16
  prefetch_factor: 8
  pin_memory     : true

  foreground_oversample_ratio: 0.0
  samples_per_volume         : 8

  cache_mode       : "memory"
  cache_max_volumes: 24


augment:
  enabled: false


model:
  backbone: "resnet"
  encoder_channels: [64, 64, 128, 256, 512]
  encoder_blocks_per_stage: [2, 2, 2, 2, 2]
  decoder_blocks_per_stage: [2, 2, 2, 2]
  block_type: "basic"

  norm_type  : "instance"
  norm_groups: 8
  activation : "leakyrelu"
  dropout    : 0.0

  attention_type: "none"
  skip_attention: true

  deep_supervision   : false
  aux_seg_supervision: false
  aux_topo_head      : false

  stem_mode      : "conv3"
  decoder_type   : "unet"
  downsample_mode: "conv"
  upsample_mode  : "trilinear"
  skip_mode      : "cat"


train:
  epochs: 200

  optimizer   : "adamw"
  lr          : 1.0e-3
  weight_decay: 1.0e-4

  scheduler    : "cosine"
  warmup_epochs: 5
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6

  grad_accum_steps: 4
  grad_clip_norm  : 12.0

  use_amp  : false
  amp_dtype: "auto"

  compile_mode: "none"

  use_ema  : true
  ema_decay: 0.999

  output_dir: "outputs/ssl_prior"

  log_every: 10

  seed: 42
  deterministic: false


ssl:
  enabled: true
  method : "prior"                 # 回归 Frangi vesselness
  recon_loss: "l1"

  prior_scales       : [1.0, 2.0, 3.0]   # 覆盖细→粗血管口径
  prior_alpha        : 0.5
  prior_beta         : 0.5
  prior_black_vessels: false             # CT 增强血管偏亮
  prior_corrupt_input: false             # 纯净输入→vesselness（true 则输入也做 Genesis 破坏）

  save_every: 10
