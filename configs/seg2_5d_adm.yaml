# 2.5D 分割 — ADM U-Net (Dhariwal & Nichol, NeurIPS 2021) 作分割 backbone:
#   GroupNorm32 + SiLU + ResBlock (去 timestep-emb) + 最深两级 multi-head Attention
#   stem: 'shared_stem' | 'multi_stem_proj' ('hierarchical' 本 arch 不支持)
#   输出 (B, num_fg*D, H, W); SliceChannelLoss 拆分
#   aux_seg_supervision (仅 Plan A) 与 deep_supervision 正交
#
# arch=='adm' 时忽略: model.backbone/block_type/norm_type/activation/attention_type
#   /use_se/decoder_type/unet3p_cat_channels/resenc_preset/skip_attention
#   /skip_mode/upsample_mode/downsample_mode/drop_path_rate (论文固定)
# 生效字段: data.*, encoder_channels/encoder_blocks_per_stage/decoder_blocks_per_stage,
#   stem_mode/stem_fusion_mode, deep_supervision/aux_seg_supervision/aux_head_mode,
#   dropout (ResBlock), adm_attention_levels/adm_num_heads/adm_num_head_channels

# DATA — 同 seg2_5d.yaml
data:
  image_suffix: ".nii.gz"
  label_suffix: ".nii.gz"
  bbox_suffix : "_pred.nii.gz"
  region_weight_suffix: ".nii.gz"
  # # Training dir
  # image_dir: ""
  # label_dir: ""
  # bbox_dir : ""
  # region_weight_dir: ""
  # npz_dir: "F:/BaiduNetdiskDownload/lung_prep"

  # Inference dir
  image_dir: "F:/airway_segment_with_img/imgs"
  bbox_dir : "F:/airway_segment_with_img/body_convnext_pred"

  label_values: [0, 1]
  num_classes : 2

  patch_size: [12, 320, 400]
  patch_mode: "2_5d"

  multi_res_scales: [1.0, 1.5, 2.0]
  aug_oversample_ratio: 1.5

  # Required when keep_native_view_depth=True (ADM consumes per-view native depths).
  z_boundary_mode: "edge_pad"
  keep_native_view_depth: true

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio : 0.2
  split_seed: 42
  stratified_split: true

  batch_size : 4
  num_workers: 4
  prefetch_factor: 4
  pin_memory : true

  foreground_oversample_ratio: 0.3
  samples_per_volume: 8

  cache_mode: "memory"
  cache_max_volumes: 2


# AUGMENT — 同 seg2_5d.yaml
augment:
  enabled: true
  random_flip_prob: 0.5
  random_flip_axes: [2, 3, 4]
  random_affine_prob : 0.3
  random_rotate_range: [-15.0, 15.0]
  random_scale_range : [0.85, 1.15]
  elastic_deform_prob : 0.0
  elastic_deform_sigma: 5.0
  elastic_deform_alpha: 1.0
  random_brightness_prob : 0.3
  random_brightness_range: [-0.1, 0.1]
  random_contrast_prob : 0.3
  random_contrast_range: [0.8, 1.2]
  random_gamma_prob : 0.2
  random_gamma_range: [0.8, 1.2]
  gaussian_noise_prob: 0.2
  gaussian_noise_std : 0.09
  gaussian_blur_prob : 0.1
  gaussian_blur_sigma: [0.5, 1.5]
  simulate_lowres_prob: 0.1
  simulate_lowres_zoom: [0.5, 1.0]


# MODEL — ADM U-Net
model:
  arch: "adm"

  encoder_channels: [32, 64, 128, 256, 256]
  encoder_blocks_per_stage: [2, 2, 2, 2, 2]
  # ADM/EDM2 忽略此字段 (decoder 块数由 encoder skip-stack 固定: nb_k+1); 仅警告不一致
  decoder_blocks_per_stage: [2, 2, 2, 2]

  stem_mode: "conv7"
  stem_fusion_mode: "multi_stem_proj"     # 'shared_stem' | 'multi_stem_proj' (不支持 hierarchical)

  deep_supervision: false
  aux_seg_supervision: true
  aux_head_mode: "linear"

  dropout: 0.0                          # 复用为 ResBlock dropout (论文默认 0.0)

  # 默认最深两级 (5 stages → [3,4]); 论文 256² 输入对应 attention_resolutions=[16,8]
  adm_attention_levels: [3, 4]
  adm_num_heads: 4
  adm_num_head_channels: -1

  # 可选线性 attention (lucidrains; O(N) vs softmax O(N²)), 推荐用在浅高分辨率级。
  # 与 adm_attention_levels 独立加成; 推荐: [] | [0,1] | [0,1,2,3] + adm_attention_levels=[4]
  adm_linear_attention_levels: []
  adm_linear_attention_num_heads: 4
  adm_linear_attention_head_dim: 32     # 64 增容 (cost ∝ head_dim²·N)


# LOSS / TRAIN / PREDICT — 同 seg2_5d.yaml
loss:
  name: "dice_focal"
  compound_weights: [1.0, 1.0]
  class_weights: [1.0, 1.0]
  region_weights: [1.0, 4.0, 2.0]
  dice_smooth : 1.0e-5
  dice_squared: false
  focal_alpha: 0.5
  focal_gamma: 2.0
  tversky_alpha: 0.3
  tversky_beta : 0.7
  deep_supervision_weights: [1.0, 0.5, 0.25, 0.125]
  slice_loss_reduction: "per_volume"
  aux_supervision_weights: []


train:
  epochs: 100

  optimizer   : "adamw"
  lr          : 1.0e-3
  weight_decay: 1.0e-4

  scheduler: "cosine"
  warmup_epochs: 5
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6

  grad_accum_steps: 1
  grad_clip_norm: 12.0

  use_amp  : true
  amp_dtype: "auto"

  compile_mode: "default"

  use_ema  : true
  ema_decay: 0.999

  output_dir: "outputs/lung_adm"
  save_every: 10
  # 选模标准：唯一接口；save_best_metric/mode 由此自动派生。
  save_best_criterion: "dice"

  early_stopping: 15

  log_every: 10
  val_every: 1
  vis_every: 10

  seed: 42
  deterministic: false


predict:
  z_interleave_enabled: false
  z_interleave_thresholds: [1.0, 1.5]
  z_interleave_factors: [3, 2, 1]
  z_overlap : 0.5
  blend_mode: "gaussian"
  batch_size: 4
  tta_flip  : false
  threshold : 0.5
  output_dir: "predictions"
  save_probabilities: false
