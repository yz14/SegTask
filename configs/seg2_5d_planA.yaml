# ============================================================================
# Plan A lift —— 2.5D pipeline → True 3D model (R(2+1)D blocks)
# ----------------------------------------------------------------------------
# 派生自 configs/seg2_5d.yaml，仅在以下字段做了"切方案"修改，其他保持一致：
#
#   model.backbone           : "convnext" → "resnet"   (r2plus1d 仅在 resnet 注册)
#   model.block_type         : "basic"    → "r2plus1d" ((1,3,3) 空间 + (3,1,1) z)
#   model.lift_2_5d_to_3d    : false      → true      (D 还原为真实空间轴)
#   model.spatial_dims       : 2          → 3         (sync() 自动设；写出仅可读)
#   model.in_channels        : 自动       → 3         (sync(): = len(multi_res_scales))
#   model.aux_seg_supervision: true       → false     (本轮先跑主路径基线)
#   data.aux_keep_native_d   : true       → false     (与 lift 互斥；validate 强制)
#   data.patch_size          : [12,256,256] → [16,256,256]
#       (5 stages encoder ⇒ D 必须能被 2**(n_levels-1)=16 整除；12 不合法)
#   data.z_boundary_mode     : "stretch"  → "edge_pad" (lift 路径推荐统一 edge_pad)
#   train.output_dir         : 独立目录，不与 convnext 实验 ckpt 冲突
#   train.resume / pretrain  : 清空（架构不兼容旧 ckpt）
#
# 一句话说明动机：
#   原 2D-folded 2.5D 把 D 折进 channel，整网无 z 算子；lift 后 D 是真实空间轴，
#   每个 R(2+1)D block 都做 (3,1,1) z 卷积，z-context 从 stem 一直走到 head；
#   多 FOV (1.0/1.5/2.0×) 现在作为 n_views=3 的输入通道喂给 3D UNet，与 z 卷积
#   一起真正能融合粗/细 z 上下文。
#
# 启动：
#   python -m segtask_v1.train --config configs/seg2_5d_planA.yaml
# ============================================================================

# =====================================================================
# DATA
# =====================================================================
data:
  image_suffix: ".nii.gz"
  label_suffix: ".nii.gz"
  bbox_suffix : ".nii.gz"
  region_weight_suffix: ".nii.gz"

  # 与 seg2_5d.yaml 保持一致的 lung 训练源
  image_dir: "F:/BaiduNetdiskDownload/lung_nii"
  label_dir: "F:/BaiduNetdiskDownload/lung_bone"
  region_weight_dir: "F:/BaiduNetdiskDownload/lung_weight"
  bbox_dir : "F:/CT_data/airway_segment_data/bone_bbox"
  npz_dir: "F:/BaiduNetdiskDownload/lung_prep"

  label_values: [0, 1, 2]
  num_classes : 3

  # *** 关键修改 1 ***
  # 5 stages encoder (encoder_channels 长度=5) ⇒ 4 次下采样 ⇒ D 必须能被
  # 16 整除。lift 模式下 D 是真实空间轴，每一级 Downsample 都会把 D 减半。
  # 12 在 D=4 时就不再整除——validate 会直接报错。改成 16。
  patch_size: [16, 256, 256]

  patch_mode: "2_5d"

  # lift 模式下作为 n_views=3 的输入通道喂进 3D UNet。
  multi_res_scales: [1.0, 1.5, 2.0]

  aug_oversample_ratio: 1.5

  # *** 关键修改 2 ***
  # lift 路径建议统一 edge_pad；stretch 在 D 是真空间轴的情况下会让边界
  # 窗口的 z 物理间距与中心窗口不同，破坏 R(2+1)D 的 z 卷积归纳偏置。
  z_boundary_mode: "edge_pad"

  # *** 关键修改 3 ***
  # validate() 强制：lift_2_5d_to_3d=True 与 aux_keep_native_d=True 互斥
  # （folded-D 通道槽位 vs 真 D 空间轴在物理布局上不兼容）。本轮先关闭。
  aux_keep_native_d: false

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio : 0.2
  split_seed: 42
  stratified_split: true

  batch_size : 4
  num_workers: 4
  prefetch_factor: 4
  pin_memory : true

  foreground_oversample_ratio: 0.3
  samples_per_volume: 8

  cache_mode: "memory"
  cache_max_volumes: 2


# =====================================================================
# AUGMENT  —— 与 seg2_5d.yaml 完全一致
# =====================================================================
augment:
  enabled: true

  random_flip_prob: 0.5
  random_flip_axes: [2, 3, 4]

  random_affine_prob : 0.3
  random_rotate_range: [-15.0, 15.0]
  random_scale_range : [0.85, 1.15]

  elastic_deform_prob : 0.0
  elastic_deform_sigma: 5.0
  elastic_deform_alpha: 1.0

  random_brightness_prob : 0.3
  random_brightness_range: [-0.1, 0.1]

  random_contrast_prob : 0.3
  random_contrast_range: [0.8, 1.2]

  random_gamma_prob : 0.2
  random_gamma_range: [0.8, 1.2]

  gaussian_noise_prob: 0.2
  gaussian_noise_std : 0.09

  gaussian_blur_prob : 0.1
  gaussian_blur_sigma: [0.5, 1.5]

  simulate_lowres_prob: 0.1
  simulate_lowres_zoom: [0.5, 1.0]


# =====================================================================
# MODEL  —— Plan A: ResNet + R(2+1)D + lift_2_5d_to_3d
# =====================================================================
model:
  # *** 关键修改 4 ***
  # r2plus1d 仅在 resnet backbone 下注册（convnext 没有这个 block）。
  backbone: "resnet"

  # sync() 自动设 spatial_dims=3 / in_channels=len(multi_res_scales)=3；
  # 写出来仅为可读性。
  spatial_dims: 3
  in_channels: 3

  # 5 stages encoder：通道宽度与 seg2_5d.yaml 保持同量级，方便对比；
  # 因为 lift 后 D 也参与 Downsample，激活体积比 2.5D 大，必要时可降到
  # [24, 48, 96, 192, 192] 以省显存。
  encoder_channels: [32, 64, 128, 256, 256]
  encoder_blocks_per_stage: [2, 2, 3, 3, 3]   # ResEnc-S 风格
  decoder_blocks_per_stage: [2, 2, 2, 2]

  # *** 关键修改 5 ***
  # (1,3,3) 空间 conv + 中间非线性 + (3,1,1) 时间 conv。每个 stage 的每个
  # block 都做一次 z 卷积——z-context 不再只靠 stem。
  block_type: "r2plus1d"

  # *** 关键修改 6 ***
  # 开启 lift：trainer 跳过 (B, C_res, D, H, W) → (B, C_res*D, H, W) 的 squeeze；
  # 模型输入保持 (B, n_views=3, D=16, H, W)；输出 (B, num_fg=2, D, H, W)；
  # 损失走 MultiResolutionLoss(num_res=1)（绕过 SliceChannelLoss）。
  lift_2_5d_to_3d: true

  norm_type  : "instance"
  norm_groups: 8
  activation : "leakyrelu"
  dropout    : 0.0

  # r2plus1d block 自身已经在每个 stage 引入 z conv，不再叠加 SE，避免
  # 把 z 上下文从特征里"挑掉"（SE 是通道注意力，会重新加权）。
  use_se: false
  attention_type: "none"
  skip_attention: false

  deep_supervision: false

  stem_mode    : "conv3"

  # lift 模式下 n_views 作为输入通道直接进 stem；多视图融合不再走
  # MultiStemProj/Hierarchical（那两条路径是 2D-folded 专属）。
  # context_fusion 字段在 lift 下被忽略，但写明默认值便于阅读。
  context_fusion: "shared_stem"

  # *** 关键修改 7 ***
  # 本轮先跑 lift 主路径的基线（仅 view 0 监督，其他视图作为输入通道）。
  # 收敛后若想再加 aux 监督，把这个开关打开即可（validate 已正交支持
  # lift + aux_seg_supervision，aux head 自动产 (B, num_fg, D, H, W)）。
  aux_seg_supervision: false
  aux_head_mode: "linear"

  decoder_type   : "unet"
  downsample_mode: "conv"
  upsample_mode  : "trilinear"
  skip_mode      : "cat"

  drop_path_rate: 0.0


# =====================================================================
# LOSS  —— lift 模式自动绕过 SliceChannelLoss；其余配置沿用
# =====================================================================
loss:
  name: "dice_focal"
  compound_weights: [1.0, 1.0]

  class_weights: [1.0, 1.0]
  region_weights: [1.0, 4.0, 2.0]

  dice_smooth : 1.0e-5
  dice_squared: false

  focal_alpha: 0.5
  focal_gamma: 2.0

  tversky_alpha: 0.3
  tversky_beta : 0.7

  deep_supervision_weights: [1.0, 0.5, 0.25, 0.125]

  # lift 模式下不调用 SliceChannelLoss；此字段被忽略但保留可读性。
  slice_loss_reduction: "per_volume"

  aux_supervision_weights: []


# =====================================================================
# TRAIN
# =====================================================================
train:
  epochs: 100

  optimizer   : "adamw"
  lr          : 1.0e-3
  weight_decay: 1.0e-4

  scheduler: "cosine"
  warmup_epochs: 5
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6

  grad_accum_steps: 1
  grad_clip_norm: 12.0

  use_amp  : true
  amp_dtype: "auto"

  compile_mode: "default"

  use_ema  : true
  ema_decay: 0.999

  # *** 关键修改 8 *** 独立输出目录，与 convnext 实验互不污染
  output_dir: "outputs/lung_bone_planA_r2plus1d"
  save_every: 10
  save_best_metric: "mean_dice"
  save_best_mode: "max"

  early_stopping: 15

  log_every: 10
  val_every: 1
  vis_every: 10

  seed: 42
  deterministic: false

  # *** 关键修改 9 *** 架构不兼容旧 ckpt，从头训练
  resume: ""
  pretrain: ""
  pretrain_strict: false
  pretrain_load_ema: false


# =====================================================================
# PREDICT  —— 与 seg2_5d.yaml 一致；predictor 检测 lift_2_5d_to_3d
#             自动走 rank-5 输入 + (B, num_fg, D, H, W) 输出路径
# =====================================================================
predict:
  z_interleave_enabled: true
  z_interleave_thresholds: [1.0, 1.5]
  z_interleave_factors: [3, 2, 1]
  z_overlap : 0.5
  blend_mode: "gaussian"
  batch_size: 4
  tta_flip  : false
  threshold : 0.5
  output_dir: "predictions"
  save_probabilities: false
