# Plan A lift — 2.5D pipeline → 真 3D 模型 (R(2+1)D blocks)。派生自 configs/seg2_5d.yaml。
# 动机: 2D-folded 2.5D D 折入 channel 无 z 算子; lift 后 D 是真空间轴,
# 每 R(2+1)D block 做 (3,1,1) z conv，z-context 从 stem 走到 head。
# 多 FOV (1/1.5/2×) 作 n_views=3 输入通道嗂给 3D UNet。
#
# 与 seg2_5d.yaml 关键 diff:
#   model.backbone:           convnext → resnet      (r2plus1d 仅 resnet 注册)
#   model.block_type:         basic    → r2plus1d
#   model.lift_2_5d_to_3d:    false    → true        (D 还原为真空间轴)
#   model.aux_seg_supervision: true    → false       (本轮先跑主路径基线)
#   data.aux_keep_native_d:   true     → false       (与 lift 互斥)
#   data.patch_size:          [12,...] → [16,...]    (5 stages: D 需被 16 整除)
#   data.z_boundary_mode:     stretch  → edge_pad    (lift 下 z 几何一致性)
#   train.output_dir / resume / pretrain: 独立目录, 清空 (架构不兼容旧 ckpt)
#
# 启动: python -m segtask_v1.train --config configs/seg2_5d_planA.yaml

data:
  image_suffix: ".nii.gz"
  label_suffix: ".nii.gz"
  bbox_suffix : ".nii.gz"
  region_weight_suffix: ".nii.gz"

  # 与 seg2_5d.yaml 保持一致的 lung 训练源
  image_dir: "F:/BaiduNetdiskDownload/lung_nii"
  label_dir: "F:/BaiduNetdiskDownload/lung_bone"
  region_weight_dir: "F:/BaiduNetdiskDownload/lung_weight"
  bbox_dir : "F:/CT_data/airway_segment_data/bone_bbox"
  npz_dir: "F:/BaiduNetdiskDownload/lung_prep"

  label_values: [0, 1, 2]
  num_classes : 3

  # 5 stages encoder ⇒ D 需被 16 整除 (lift 下 D 是真空间轴, 逐级减半)
  patch_size: [16, 256, 256]
  patch_mode: "2_5d"

  multi_res_scales: [1.0, 1.5, 2.0]    # lift 下作 n_views=3 输入通道
  aug_oversample_ratio: 1.5

  z_boundary_mode: "edge_pad"          # lift 下 z 几何需与中心窗一致 (R(2+1)D 偏置)
  aux_keep_native_d: false             # 与 lift 互斥 (validate 强制)

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio : 0.2
  split_seed: 42
  stratified_split: true

  batch_size : 4
  num_workers: 4
  prefetch_factor: 4
  pin_memory : true

  foreground_oversample_ratio: 0.3
  samples_per_volume: 8

  cache_mode: "memory"
  cache_max_volumes: 2


# AUGMENT — 与 seg2_5d.yaml 一致
augment:
  enabled: true

  random_flip_prob: 0.5
  random_flip_axes: [2, 3, 4]

  random_affine_prob : 0.3
  random_rotate_range: [-15.0, 15.0]
  random_scale_range : [0.85, 1.15]

  elastic_deform_prob : 0.0
  elastic_deform_sigma: 5.0
  elastic_deform_alpha: 1.0

  random_brightness_prob : 0.3
  random_brightness_range: [-0.1, 0.1]

  random_contrast_prob : 0.3
  random_contrast_range: [0.8, 1.2]

  random_gamma_prob : 0.2
  random_gamma_range: [0.8, 1.2]

  gaussian_noise_prob: 0.2
  gaussian_noise_std : 0.09

  gaussian_blur_prob : 0.1
  gaussian_blur_sigma: [0.5, 1.5]

  simulate_lowres_prob: 0.1
  simulate_lowres_zoom: [0.5, 1.0]


# MODEL — ResNet + R(2+1)D + lift。spatial_dims/in_channels 由 sync() 自动设
model:
  backbone: "resnet"                   # r2plus1d 仅在 resnet 注册

  # 显存紧可降到 [24,48,96,192,192]
  encoder_channels: [32, 64, 128, 256, 256]
  encoder_blocks_per_stage: [2, 2, 3, 3, 3]   # ResEnc-S 风格
  decoder_blocks_per_stage: [2, 2, 2, 2]

  block_type: "r2plus1d"               # (1,3,3) 空间 + (3,1,1) z; 每 block 做 z conv
  lift_2_5d_to_3d: true                # 跳过 squeeze, 走 3D UNet + MultiResLoss(1)

  norm_type  : "instance"
  norm_groups: 8
  activation : "leakyrelu"
  dropout    : 0.0

  # r2plus1d 已在每 stage 引入 z conv, 不再叠加 SE (避免通道加权"挑掉" z 上下文)
  use_se: false
  attention_type: "none"
  skip_attention: false

  deep_supervision: false

  stem_mode    : "conv3"
  context_fusion: "shared_stem"        # lift 下字段被忽略 (仅 2D-folded 生效)

  aux_seg_supervision: false           # 本轮跑 lift 主路径基线; 收敛后可开
  aux_head_mode: "linear"

  decoder_type   : "unet"
  downsample_mode: "conv"
  upsample_mode  : "trilinear"
  skip_mode      : "cat"

  drop_path_rate: 0.0


# LOSS — lift 下自动绕过 SliceChannelLoss
loss:
  name: "dice_focal"
  compound_weights: [1.0, 1.0]

  class_weights: [1.0, 1.0]
  region_weights: [1.0, 4.0, 2.0]

  dice_smooth : 1.0e-5
  dice_squared: false

  focal_alpha: 0.5
  focal_gamma: 2.0

  tversky_alpha: 0.3
  tversky_beta : 0.7

  deep_supervision_weights: [1.0, 0.5, 0.25, 0.125]

  slice_loss_reduction: "per_volume"   # lift 下被忽略 (不走 SliceChannelLoss)
  aux_supervision_weights: []


train:
  epochs: 100

  optimizer   : "adamw"
  lr          : 1.0e-3
  weight_decay: 1.0e-4

  scheduler: "cosine"
  warmup_epochs: 5
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6

  grad_accum_steps: 1
  grad_clip_norm: 12.0

  use_amp  : true
  amp_dtype: "auto"

  compile_mode: "default"

  use_ema  : true
  ema_decay: 0.999

  output_dir: "outputs/lung_bone_planA_r2plus1d"     # 独立目录
  save_every: 10
  save_best_metric: "mean_dice"
  save_best_mode: "max"

  early_stopping: 15

  log_every: 10
  val_every: 1
  vis_every: 10

  seed: 42
  deterministic: false

  resume: ""                           # 架构不兼容旧 ckpt, 从头训练
  pretrain: ""
  pretrain_strict: false
  pretrain_load_ema: false


# PREDICT — predictor 检测 lift_2_5d_to_3d 自动走 rank-5 + (B,num_fg,D,H,W) 输出
predict:
  z_interleave_enabled: true
  z_interleave_thresholds: [1.0, 1.5]
  z_interleave_factors: [3, 2, 1]
  z_overlap : 0.5
  blend_mode: "gaussian"
  batch_size: 4
  tta_flip  : false
  threshold : 0.5
  output_dir: "predictions"
  save_probabilities: false
