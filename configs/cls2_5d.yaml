# 2.5D 折叠分类 reference 配置（slab 深度 D 折进通道，spatial_dims=2）。
# 用法: python -m clstask.train --config configs/cls2_5d.yaml [--override key=val ...]
# 说明: patch_mode=2_5d + multi_res_scales=[1.0] => in_channels=D, spatial_dims=2
#   （与 image-only SSL 预训练几何一致）。逐 slice 标签: 每前景类每 z 切片是否出现。

data:
  npz_suffix : ".npz"
  npz_dir    : "F:/LUNA25/cls_npz"
  npz_auto_build: false

  label_values: [0, 1]
  num_classes : 2

  patch_size: [12, 256, 256]   # 2.5D: D=切片数=in_channels
  patch_mode: "2_5d"
  multi_res_scales: [1.0]      # 单 FOV（clstask 2.5D 约束）
  z_boundary_mode: "edge_pad"

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio : 0.2
  split_seed: 42

  batch_size        : 4
  num_workers       : 4
  pin_memory        : true
  persistent_workers: true
  prefetch_factor   : 4
  foreground_oversample_ratio: 0.3
  samples_per_volume         : 8

augment:
  enabled: false

model:
  backbone: "resnet"
  encoder_channels: [32, 64, 128, 256]
  encoder_blocks_per_stage: [2, 2, 2, 2]
  block_type: "basic"
  norm_type  : "instance"
  activation : "leakyrelu"
  stem_mode      : "conv3"

train:
  epochs: 50
  optimizer   : "adamw"
  lr          : 1.0e-3
  weight_decay: 1.0e-4
  scheduler    : "cosine"
  warmup_epochs: 2
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6
  grad_clip_norm: 12.0
  use_amp  : true
  amp_dtype: "auto"
  use_ema  : true
  ema_decay: 0.999
  output_dir: "outputs/cls2_5d"

cls:
  label_granularity: "slice"       # 逐 slice 分类（输出 (B, K, D)）
  label_source     : "mask"
  multi_label      : true
  backbone         : "encoder"
  pooling          : "avg"
  head_hidden_dim  : 256
  loss_type        : "bce"
  # pretrained_ckpt: "outputs/ssl_2_5d/ssl_best.pt"
  encoder_lr_mult  : 1.0
  agg_mode         : "max"         # 逐 slice → 卷级用 max 更贴合 MIL
  eval_patches_per_volume: 8
  save_best_metric : "auc"
