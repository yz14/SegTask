# 2.5D 超分（生成任务）— 条件扩散（EDM / DDPM），ADM U-Net backbone
#
# TODO #2：用经典生成算法改写 gentask。本配置走「条件扩散」范式（类 SR3 / Palette）：
#   以低分图为条件，从噪声迭代去噪采样出高分图。复用 ADM U-Net 并**重新启用**
#   timestep/σ 条件（AdaGN scale-shift），论文忠实（Dhariwal & Nichol 2021）。
#
# parameterization:
#   'edm'      —— Karras 2022 去噪预条件 + 对数正态 σ 采样 + Heun 二阶采样（默认，更稳）
#   'ddpm_eps' —— Ho 2020 ε-预测 + β schedule + 祖先 / DDIM 采样
# 扩散仅支持 arch ∈ {adm, edm2}（需 σ/timestep 条件）。

data:
  image_suffix: ".nii.gz"
  label_suffix: ".nii.gz"
  image_dir: "F:/med_data/imgs"
  label_dir: "F:/med_data/lbls"   # 生成任务忽略标签

  label_values: [0, 1]
  num_classes : 2

  patch_size: [12, 320, 400]
  patch_mode: "2_5d"
  multi_res_scales: [1.0]
  aug_oversample_ratio: 1.0

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio : 0.2
  split_seed: 42
  batch_size : 2
  num_workers: 4
  samples_per_volume: 8
  cache_mode: "memory"
  cache_max_volumes: 2

model:
  arch                    : "adm"
  encoder_channels        : [32, 64, 128, 256]
  encoder_blocks_per_stage: [2, 2, 2, 2]
  stem_mode               : "conv7"
  dropout                 : 0.0

  adm:
    attention_levels : [3]
    num_heads        : 4
    num_head_channels: -1
task:
  type: "generation"
  algorithm: "diffusion"
  degradation: "superres"
  out_channels: 1

  sr_scale: 2
  sr_kernel: "area"

  # 扩散参数化与训练 / 采样
  parameterization: "edm"     # 'edm' | 'ddpm_eps'
  sigma_data: 0.5             # EDM：数据尺度（minmax 归一后约 0.5）
  p_mean: -1.2                # EDM：ln σ 采样均值
  p_std: 1.2                  # EDM：ln σ 采样标准差
  sampler: "edm_heun"         # 'edm_heun'（EDM）| 'ddpm' | 'ddim'（DDPM）
  sample_steps: 18
  sigma_min: 0.002
  sigma_max: 80.0
  rho: 7.0
  # DDPM（parameterization='ddpm_eps' 时生效）
  num_train_timesteps: 1000
  beta_schedule: "linear"
  ddim_eta: 0.0

train:
  epochs: 200
  optimizer   : "adamw"
  lr          : 1.0e-4
  weight_decay: 0.0
  scheduler: "cosine"
  warmup_epochs: 5
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6
  grad_clip_norm: 1.0
  use_amp  : true
  amp_dtype: "auto"
  compile_mode: "none"
  use_ema  : true
  ema_decay: 0.9999
  output_dir: "outputs/gensr_diffusion_adm"
  log_every: 20
  seed: 42


predict:
  output_dir: "predictions_sr"
