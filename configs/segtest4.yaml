data:
  image_suffix: ".nii.gz"
  label_suffix: ".nii.gz"
  bbox_suffix : ".nii.gz"
  region_weight_suffix: ".nii.gz"

  npz_dir: "/data0/yzhen/data/totalseg/body_prep"
  image_dir: "F:/airway_segment_with_img/imgs"

  label_values: [0, 1]
  num_classes : 2

  patch_size: [12, 256, 256]
  patch_mode: "2_5d"

  multi_res_scales    : [1.0, 1.5, 2.0]
  aug_oversample_ratio: 1.5

  z_boundary_mode: "edge_pad"

  aux_keep_native_d: true

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio       : 0.2
  split_seed      : 42
  stratified_split: true

  batch_size     : 8
  num_workers    : 16
  prefetch_factor: 8
  pin_memory     : true

  foreground_oversample_ratio: 0.3
  samples_per_volume         : 8

  cache_mode       : "memory"
  cache_max_volumes: 12


augment:
  enabled: true

  random_flip_prob: 0.2
  random_flip_axes: [2, 3, 4]

  random_affine_prob : 0.3
  random_rotate_range: [-15.0, 15.0]
  random_scale_range : [0.85, 1.15]

  elastic_deform_prob : 0.0
  elastic_deform_sigma: 5.0
  elastic_deform_alpha: 1.0

  random_brightness_prob : 0.3
  random_brightness_range: [-0.1, 0.1]

  random_contrast_prob : 0.3
  random_contrast_range: [0.8, 1.2]

  random_gamma_prob : 0.2
  random_gamma_range: [0.8, 1.2]

  gaussian_noise_prob: 0.2
  gaussian_noise_std : 0.09

  gaussian_blur_prob : 0.1
  gaussian_blur_sigma: [0.5, 1.5]

  simulate_lowres_prob: 0.1
  simulate_lowres_zoom: [0.5, 1.0]


model:
  backbone: "resnet"
  encoder_channels: [64, 128, 256, 256, 256]
  encoder_blocks_per_stage: [2, 2, 2, 2, 2]
  decoder_blocks_per_stage: [2, 2, 2, 2]
  block_type: "basic"

  lift_2_5d_to_3d: false

  norm_type  : "instance"         # 'instance' | 'batch' | 'group'
  norm_groups: 8
  activation : "leakyrelu"        # 'leakyrelu' | 'gelu' | 'relu'
  dropout    : 0.0

  use_se        : false    # SE attn
  attention_type: "none"
  skip_attention: false

  deep_supervision: true

  stem_mode    : "conv7"

  context_fusion: "multi_stem_proj"

  aux_seg_supervision: true

  aux_head_mode: "linear"

  decoder_type   : "unet"         # 'unet' | 'unetpp' | 'unet3p'
  downsample_mode: "conv"         # 'conv' (学习) | 'maxpool'
  upsample_mode  : "trilinear"    # 'transpose' (学习) | 'trilinear'
  skip_mode      : "cat"          # 'cat' | 'add'

  drop_path_rate : 0.0


loss:
  name: "dice_focal"             # 'dice' | 'dice_ce' | 'dice_focal' | 'dice_focal_tversky' | ...
  compound_weights: [1.0, 1.0]

  class_weights : [1.0]       # 长度 = num_fg_classes (不含 bg)
  region_weights: [1.0, 5.0]  # 按 label_values 全长 (含 bg)

  dice_smooth : 1.0e-5
  dice_squared: false

  focal_alpha: 0.5
  focal_gamma: 2.0

  tversky_alpha: 0.3
  tversky_beta : 0.7

  deep_supervision_weights: [1.0, 0.5, 0.25, 0.125]

  slice_loss_reduction: "per_volume"

  aux_supervision_weights: [0.5, 0.5]


train:
  epochs: 100

  optimizer   : "adamw"
  lr          : 1.0e-3
  weight_decay: 1.0e-4

  scheduler    : "cosine"
  warmup_epochs: 5
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6

  grad_accum_steps: 1
  grad_clip_norm  : 12.0

  use_amp  : true
  amp_dtype: "auto"

  compile_mode: "none"

  use_ema  : true
  ema_decay: 0.999

  output_dir      : "outputs/body_resnet2_ds"
  save_every      : 10
  save_best_metric: "mean_dice"
  save_best_mode  : "max"

  early_stopping: 20

  log_every: 10
  val_every: 1
  vis_every: 10

  seed: 42
  deterministic: false

  resume: ""

  pretrain: ""
  pretrain_strict: false
  pretrain_load_ema: false

predict:
  z_interleave_enabled: false
  z_interleave_thresholds: [1.0, 1.5]
  z_interleave_factors: [3, 2, 1]
  z_overlap : 0.5
  blend_mode: "gaussian"          # 'gaussian' | 'constant'
  batch_size: 4
  tta_flip  : false
  threshold : 0.5
  output_dir: "predictions"
  save_probabilities: false