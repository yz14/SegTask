# 3D 厚层→薄层超分（生成任务）— z 轴各向异性回归复原 + 预计算重要性图加权
#
# 在普通 3D 回归超分基础上，额外提供 per-voxel 重要性体图：
#   data.region_weight_dir    : 与 image_dir / label_dir 一一对应的预计算权重目录
#   data.region_weight_suffix : 权重文件后缀（示例同 .nii.gz）
# 权重体是 label-independent 的“importance map”，值在读取时做 +1 offset，
# 并以 batch["weight_map"] 的形式进入重建损失；若同时设置了 region_weights，
# 该预计算权重图会覆盖按标签静态生成的 region_weights。

data:
  image_suffix: ".nii.gz"
  label_suffix: ".nii.gz"
  region_weight_suffix: ".nii.gz"

  # 训练 / 推理目录（按本机修改）
  image_dir: "F:/med_data/imgs"
  label_dir: "F:/med_data/lbls"   # 生成任务忽略标签，但 loader 仍需该字段
  region_weight_dir: "F:/med_data/region_weights"  # 预计算 importance map 目录

  label_values: [0, 1]
  num_classes : 2

  patch_size: [32, 256, 256]      # [D, H, W]
  patch_mode: "z_axis"            # 沿 z 轴滑块，保留 x,y 全分辨率上下文

  # 生成任务单视图：multi_res_scales 必须为 [1.0]
  multi_res_scales: [1.0]
  aug_oversample_ratio: 1.0

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio : 0.2
  split_seed: 42

  batch_size : 2
  num_workers: 4
  pin_memory : true

  samples_per_volume: 8
  cache_mode: "memory"
  cache_max_volumes: 1

model:
  arch: "unet"
  backbone: "resnet"
  encoder_channels: [32, 64, 128, 256]
  encoder_blocks_per_stage: [2, 2, 2, 2]
  decoder_type: "unet"


# ---- 生成任务设置 ----
task:
  type: "generation"
  algorithm: "regression"
  degradation: "superres"
  out_channels: 1

  # 各向异性超分退化：仅 z 轴（D）2x，H,W 保持原分辨率。
  # 顺序按空间轴 (D, H, W)；覆盖标量 sr_scale。
  sr_scale_per_axis: [2, 1, 1]
  sr_kernel: "area"              # area≈层厚范围内体素平均（部分容积效应）
  sr_noise_std: 0.0

  # 回归算法
  residual: false
  recon_loss: "charbonnier"
  charbonnier_eps: 1.0e-3
  ssim_weight: 0.1              # 0 关闭；>0 加 (1−SSIM) 辅助
  grad_weight: 0.0

train:
  epochs: 100
  optimizer   : "adamw"
  lr          : 2.0e-4
  weight_decay: 1.0e-4
  scheduler: "cosine"
  warmup_epochs: 5
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6
  grad_clip_norm: 1.0
  use_amp  : true
  amp_dtype: "auto"
  compile_mode: "none"
  use_ema  : true
  ema_decay: 0.999
  output_dir: "outputs/gensr_zaxis_region_weight"
  log_every: 20
  seed: 42


predict:
  output_dir: "predictions_sr_zaxis"
