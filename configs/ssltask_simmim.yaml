# 自监督预训练（ssltask, SimMIM② 式 mask-token 稠密掩码图像建模）示例配置。
# 运行：  python -m ssltask.pretrain --config configs/ssltask_simmim.yaml
# 产出：  outputs/ssltask_simmim/ssl_best.pt
# 衔接：  下游分割/分类训练加 --override train.pretrain=outputs/ssltask_simmim/ssl_best.pt
#         下游 _load_pretrain 非严格加载：encoder.* 命中；decoder.*/seg_head.* 随机
#         （MIM 不预训练解码器，head.*/mask_token 作为 unexpected 丢弃）。
#
# 重要：要让 encoder 权重 1:1 迁移，下游 config 的 `model:` 段（backbone/encoder_channels/
#       blocks/stem/norm/down 等几何项）应与本文件一致。
#
# 数据：只读 image-only npz；SSL 走单视图（multi_res_scales=[1.0]）。
# 掩码单元 mim_mask_unit 建议与骨干总下采样步长对齐（此处 5 级 conv3 stem → /16，取 16）。

data:
  npz_dir: "F:/LUNA25/ssl_npz"
  npz_suffix: ".npz"

  label_values: [0, 1]                 # 仅用于 segtask Config 校验；SSL 不读 label
  num_classes : 2

  patch_size: [96, 112, 112]
  patch_mode: "cubic"

  multi_res_scales    : [1.0]          # SSL 单视图（必须长度 1）
  aug_oversample_ratio: 1.0

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  batch_size     : 2
  num_workers    : 16
  prefetch_factor: 8
  pin_memory     : true

  samples_per_volume: 8


augment:
  # 重建类 SSL 的 trainer 级通用增强（复用 segtask GPUAugmentor，在
  # corruption/mask 之前应用；增强后的图即新的自洽重建样本）。默认仅开
  # 保守空间增强（翻转 + 小角仿射），强度扰动交由方法自身 corruption。
  enabled: true
  random_flip_prob    : 0.2
  random_affine_prob  : 0.3
  random_translate_range: [0.0, 0.0]  # SSL 无 oversample 裁剪余量，禁平移防边缘复制伪影
  elastic_deform_prob : 0.0
  grid_dropout_prob   : 0.0
  random_brightness_prob: 0.0
  random_contrast_prob  : 0.0
  random_gamma_prob     : 0.0
  gaussian_noise_prob   : 0.0
  gaussian_blur_prob    : 0.0


model:
  encoder_channels        : [64, 64, 128, 256, 512]
  encoder_blocks_per_stage: [2, 2, 2, 2, 2]
  decoder_blocks_per_stage: [2, 2, 2, 2]
  dropout                 : 0.0

  # 以下头在 SSL 阶段被丢弃；列出以便与下游对齐。
  deep_supervision        : false
  aux_seg_supervision     : false

  stem_mode               : "conv3"

  unet:
    backbone       : "resnet"
    block_type     : "basic"

    norm_type      : "instance"
    norm_groups    : 8
    activation     : "leakyrelu"

    attention_type : "none"
    skip_attention : true
    aux_topo_head  : false
    decoder_type   : "unet"
    downsample_mode: "conv"
    upsample_mode  : "trilinear"
    skip_mode      : "cat"
# 优化器/调度器/AMP/EMA/output_dir/epochs/lr 由 SSL 复用 segtask train.*。
train:
  epochs: 200

  optimizer   : "adamw"
  lr          : 1.0e-3
  weight_decay: 1.0e-4

  scheduler    : "cosine"
  warmup_epochs: 5
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6

  grad_accum_steps: 4
  grad_clip_norm  : 12.0

  use_amp  : false
  amp_dtype: "auto"

  compile_mode: "none"

  use_ema  : true
  ema_decay: 0.999

  output_dir: "outputs/ssltask_simmim"

  log_every: 10

  seed: 42
  deterministic: false


ssl:
  method : "simmim"
  recon_loss: "l1"                    # SimMIM 原选 L1（与 SparK 的 L2 对照）

  mim_mask_ratio: 0.6                 # 0.5–0.6
  mim_mask_unit : 16                  # 与总下采样步长对齐
  mim_head_dim  : 0                   # 0=auto: max(encoder_channels[-1]//2, 32)

  save_every: 10
