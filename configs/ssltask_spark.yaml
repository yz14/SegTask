# 自监督预训练（ssltask, SparK① 式掩码-稠密等价 MIM + 轻量层次解码器）示例配置。
# 运行：  python -m ssltask.pretrain --config configs/ssltask_spark.yaml
# 产出：  outputs/ssltask_spark/ssl_best.pt
# 衔接：  下游分割/分类训练加 --override train.pretrain=outputs/ssltask_spark/ssl_best.pt
#         下游 _load_pretrain 非严格加载：encoder.* 命中；decoder.*/seg_head.* 随机
#         （SparK 不预训练解码器；spark_decoder.* / mask_embed 作为 unexpected 丢弃）。
#
# 重要：要让 encoder 权重 1:1 迁移，下游 config 的 `model:` 段（backbone/encoder_channels/
#       blocks/stem/norm/down 等几何项）应与本文件一致。
#
# 数据：只读 image-only npz；SSL 走单视图（multi_res_scales=[1.0]）。
# 掩码单元 spark_mask_unit 应与骨干总下采样步长对齐（此处 5 级 conv3 stem → /16，取 16）。

data:
  npz_dir: "F:/LUNA25/ssl_npz"
  npz_suffix: ".npz"

  label_values: [0, 1]                 # 仅用于 segtask Config 校验；SSL 不读 label
  num_classes : 2

  patch_size: [96, 112, 112]
  patch_mode: "cubic"

  multi_res_scales    : [1.0]          # SSL 单视图（必须长度 1）
  aug_oversample_ratio: 1.0

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  batch_size     : 2
  num_workers    : 16
  prefetch_factor: 8
  pin_memory     : true

  samples_per_volume: 8


augment:
  enabled: false


model:
  backbone: "resnet"
  encoder_channels: [64, 64, 128, 256, 512]
  encoder_blocks_per_stage: [2, 2, 2, 2, 2]
  decoder_blocks_per_stage: [2, 2, 2, 2]
  block_type: "basic"

  norm_type  : "instance"
  norm_groups: 8
  activation : "leakyrelu"
  dropout    : 0.0

  attention_type: "none"
  skip_attention: true

  # 以下头在 SSL 阶段被丢弃；列出以便与下游对齐。
  deep_supervision   : false
  aux_seg_supervision: false
  aux_topo_head      : false

  stem_mode      : "conv3"
  decoder_type   : "unet"
  downsample_mode: "conv"
  upsample_mode  : "trilinear"
  skip_mode      : "cat"


# 优化器/调度器/AMP/EMA/output_dir/epochs/lr 由 SSL 复用 segtask train.*。
train:
  epochs: 300                          # SparK 经验：长 schedule（数百 epoch）

  optimizer   : "adamw"
  lr          : 1.0e-3
  weight_decay: 4.0e-2                 # SparK 经验 weight decay 0.04

  scheduler    : "cosine"
  warmup_epochs: 10
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6

  grad_accum_steps: 4
  grad_clip_norm  : 12.0

  use_amp  : true
  amp_dtype: "auto"

  compile_mode: "none"

  use_ema  : true
  ema_decay: 0.999

  output_dir: "outputs/ssltask_spark"

  log_every: 10

  seed: 42
  deterministic: false


ssl:
  method : "spark"
  recon_loss: "mse"                    # SparK 原选 L2（与 SimMIM 的 L1 对照）

  spark_mask_ratio    : 0.6            # SparK 经验 0.6（低于 MAE 的 0.75）
  spark_mask_unit     : 16             # 与总下采样步长对齐
  spark_decoder_dim_div: 4             # 解码器宽度除数（越大越窄，~1/5–1/10 encoder）
  spark_decoder_min_dim: 16            # 解码各级最小通道
  spark_norm_pix      : true           # per-unit 目标归一化（MAE 经验）

  save_every: 10
