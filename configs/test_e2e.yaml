# Quick end-to-end test config (2 epochs, small model)
data:
  image_dir: "F:/med_data/Totalsegmentator_dataset_v201/nii"
  label_dir: "F:/med_data/Totalsegmentator_dataset_v201/body_pred"
  image_suffix: ".nii.gz"
  label_suffix: ".nii.gz"
  label_values: [0, 1, 2]
  num_classes: 3
  patch_mode: "z_axis"
  patch_size: [16, 256, 256]
  multi_res_scales: [1.0]
  intensity_min: -1024.0
  intensity_max: 3071.0
  normalize: "minmax"
  val_ratio: 0.2
  split_seed: 42
  stratified_split: true
  batch_size: 4
  num_workers: 0
  pin_memory: false
  prefetch_factor: 2
  foreground_oversample_ratio: 0.5
  samples_per_volume: 8
  cache_mode: "memory"
  cache_max_volumes: 1

train:
  epochs: 2
  optimizer: "adamw"
  lr: 0.001
  weight_decay: 0.0001
  scheduler: "cosine"
  warmup_epochs: 0
  cosine_min_lr: 0.0001
  grad_clip_norm: 12.0
  use_amp: true
  use_ema: false
  output_dir: "outputs/test_e2e"
  save_every: 1
  save_best_criterion: "dice"
  early_stopping: 0
  log_every: 5
  val_every: 1
  seed: 42

predict:
  z_overlap: 0.5
  blend_mode: "gaussian"
  batch_size: 4
