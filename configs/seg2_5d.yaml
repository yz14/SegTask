# ============================================================================
# 2.5D Segmentation Configuration —
#   - 沿用 z_axis 取片；支持单 FOV 或多 z-FOV 上下文融合
#   - 训练增强后将 (B, C_res, D, H, W) reshape 为 (B, C_res*D, H, W) 喂给 2D 模型
#     (view 0 占前 D 通道，是真实 1× FOV，作为监督目标)
#   - 模型输出 (B, num_fg*D, H, W) 由 SliceChannelLoss 拆为
#     num_fg 组的 D 通道二值预测（与 view 0 几何严格对齐）
#
# 与 configs/seg3d.yaml 相比的关键差异：
#   - data.patch_mode: "2_5d"
#   - data.multi_res_scales: [1.0]              单 FOV（legacy，等价于 1 通道 D 切片）
#                            [1.0, 1.5, 2.0]    多 FOV：view 0 真几何，view 1..K 各
#                                                取 round(D*s) 切片再 z 轴重采样回 D
#                                                通道，提供更宽 z 上下文。
#                            约束：multi_res_scales[0] 必须为 1.0（监督目标）。
#   - data.patch_size:  D 较小（典型 8/12/16），H,W 可较大（典型 256/384）
#   - model.spatial_dims: 2                       (sync 自动设置；写出仅作可读性)
#   - model.in_channels:  D * len(multi_res_scales) (sync 自动设置)
#   - model.context_fusion: 多 FOV 时的 stem 融合策略
#                            "multi_stem_proj" — 推荐（方案 A）。每个 view 独立 stem
#                                                 + 1×1 ConvNormAct 融合回 base 通道，
#                                                 编码器下游契约不变。
#                            "shared_stem"     — 单 stem 跑 n_views*D 通道（更省参，
#                                                 但物理异质通道共用一套滤波器）。
#                            单 FOV 时该字段无效（自动退化为单 stem 路径，bit-equal）。
#
# 推荐用法：
#   python -m segtask_v1.train --config configs/seg2_5d.yaml
# ============================================================================

# =====================================================================
# DATA
# =====================================================================
data:
  image_suffix: ".nii.gz"
  label_suffix: ".nii.gz"
  bbox_suffix : ".nii.gz"
  region_weight_suffix: ".nii.gz"
  #### Just for test ####
  # image_dir: "F:/med_data/Totalsegmentator_dataset_v201/small_data/nii"
  # label_dir: "F:/med_data/Totalsegmentator_dataset_v201/small_data/mask"
  # bbox_dir : "F:/med_data/Totalsegmentator_dataset_v201/small_data/bbox"
  # region_weight_dir : "F:/med_data/Totalsegmentator_dataset_v201/small_data/region_weight"
  # npz_dir: "F:/med_data/Totalsegmentator_dataset_v201/small_data/npz"
  #### Total Segmentator ####
  # image_dir: "F:/med_data/Totalsegmentator_dataset_v201/nii"
  # label_dir: "F:/med_data/Totalsegmentator_dataset_v201/lung"
  # bbox_dir : "F:/med_data/Totalsegmentator_dataset_v201/bone"
  #### Lung ####
  image_dir: "F:/BaiduNetdiskDownload/lung_nii"
  label_dir: "F:/BaiduNetdiskDownload/lung_bone"
  region_weight_dir: "F:/BaiduNetdiskDownload/lung_weight"
  bbox_dir : "F:/CT_data/airway_segment_data/bone_bbox"  # F:/BaiduNetdiskDownload/bone_bbox
  npz_dir: "F:/BaiduNetdiskDownload/lung_prep"

  # 排除无法被 SimpleITK 读取的样本（非正交 direction cosines 等）。
  # 生成方式：
  #   python tools/scan_bad_nifti.py --config configs/seg2_5d.yaml --out tools/bad_seg2_5d
  # 生成 `tools/bad_seg2_5d/bad_pids.txt` 后填到这里即可自动跳过。留空=不过滤。
  # exclude_list: "tools/bad_seg2_5d/bad_pids.txt"

  label_values: [0, 1, 2]
  num_classes : 3

  # 2.5D patch：D = 切片数（= 模型 in_channels），H/W = 平面分辨率。
  # 经验上 D 取 8/12/16 即可（更大 D 等价于更多通道，参数显存升）；
  # H/W 可取较大（256/384）以利用 2D 模型的高效空间建模。
  patch_size: [12, 256, 256]

  # 必须为 "2_5d"。Config.sync() 会自动把 model.spatial_dims=2 +
  # model.in_channels = D * len(multi_res_scales) 同步到模型构造。
  patch_mode: "2_5d"

  # 多 z-FOV 上下文融合（方案 A）。
  #   [1.0]            — 单 FOV，legacy 行为（等价 1 通道 D 切片）。
  #   [1.0, 1.5, 2.0]  — 推荐：1× 真几何 + 1.5× / 2× 更宽 z 上下文（各 round(D*s) 切片
  #                       中心对称，z 轴重采样回 D 通道）。
  # 约束：multi_res_scales[0] 必须为 1.0（view 0 = 监督目标，几何与输出严格对齐）。
  # 配套 `model.context_fusion` 选择 stem 融合策略；详见文件顶部注释。
  multi_res_scales: [1.0, 1.5, 2.0]

  # 数据增强后的 oversample 与裁剪适用 z_axis 同样的语义（仅放大 z 轴）。
  aug_oversample_ratio: 1.5

  # Z 边界窗口的几何处理（仅影响 scale=1.0 通道；z_axis / 2.5D 模式生效）。
  #   "stretch"  —— 默认/旧行为：边界处 vol[z0:z1] 可能 < eD 张切片，
  #                  随后 resize_3d / F.interpolate 沿 z 拉伸到 eD。
  #                  缺陷：通道→z 物理映射在边界窗与中心窗不同，
  #                  2.5D "通道=切片" 的归纳偏置被破坏。
  #   "edge_pad" —— 推荐：在 z 轴上 edge-replicate 中心对称补到 eD 张切片，
  #                  保证每个通道在所有窗口都对应一个真实物理切片间距。
  #                  scale > 1.0 路径已经如此，本开关让 scale=1.0 也对齐。
  # 该开关同步覆盖训练 (SegDataset3D) 与推理 (Predictor)，保证训练-推理
  # 几何严格一致。其余 patch_mode（cubic / whole）忽略此参数。
  z_boundary_mode: "stretch"

  # 多 z-FOV 是否保持原生深度（仅 2.5D + n_views>1 + aux_seg_supervision=true 生效）。
  #   false（默认）—— 旧路径：每个 view k 抽 round(D*s_k) 张切片再 z 轴 resize 回 D，
  #                    所有视图都是 D 通道，模型输入 (B, n_views*D, H, W)；
  #                    辅助 FOV 在 z 轴上会被压缩，丢失细粒度信息。
  #   true        —— 新路径（推荐做强引导）：dataset 一次性抽取 max_scale 对应的最大
  #                    FOV cube（深度 = round(D*max_scale)，edge_pad），增强在单
  #                    cube 上跑一次（视图间几何一致由构造保证），trainer 在送入
  #                    模型前对每个 view k 中心裁出原生深度 D_k = round(D*s_k) 通
  #                    道并按 view 顺序在通道维拼接，模型输入 (B, sum(D_k), H, W)。
  #                    seg head：主头仍输出 (B, num_fg*D, H, W)；每个辅助头 k 独立
  #                    预测 (B, num_fg*D_k, H, W)，对应原生深度 label 计算损失。
  #
  # 约束：
  #   * 自动锁定 z_boundary_mode='edge_pad'（stretch 与本开关互斥）。
  #   * 仅在 patch_mode='2_5d' + len(multi_res_scales)>1 + aux_seg_supervision=true 时允许。
  #   * Plan C (hierarchical) 同时仍需满足 n_views <= len(encoder_channels) - 1。
  aux_keep_native_d: true

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio : 0.2
  split_seed: 42
  stratified_split: true

  batch_size : 4
  num_workers: 4
  prefetch_factor: 4
  pin_memory : true

  foreground_oversample_ratio: 0.3
  samples_per_volume: 8

  cache_mode: "memory"
  cache_max_volumes: 2


# =====================================================================
# AUGMENT — 与 seg3d.yaml 相同；3D 增强器在 squeeze 之前作用，
#           所以语义对 2.5D 完全一致（仍在 (B,1,D,H,W) 张量上）。
# =====================================================================
augment:
  enabled: true

  random_flip_prob: 0.5
  random_flip_axes: [2, 3, 4]   # D, H, W —— D-flip 在增强阶段做，不是推理阶段

  random_affine_prob : 0.3
  random_rotate_range: [-15.0, 15.0]
  random_scale_range : [0.85, 1.15]

  elastic_deform_prob : 0.0
  elastic_deform_sigma: 5.0
  elastic_deform_alpha: 1.0

  random_brightness_prob : 0.3
  random_brightness_range: [-0.1, 0.1]

  random_contrast_prob : 0.3
  random_contrast_range: [0.8, 1.2]

  random_gamma_prob : 0.2
  random_gamma_range: [0.8, 1.2]

  gaussian_noise_prob: 0.2
  gaussian_noise_std : 0.09

  gaussian_blur_prob : 0.1
  gaussian_blur_sigma: [0.5, 1.5]

  simulate_lowres_prob: 0.1
  simulate_lowres_zoom: [0.5, 1.0]


# =====================================================================
# MODEL — 2D UNet (spatial_dims=2)
# =====================================================================
model:
  backbone: "convnext"

  # 由 Config.sync() 自动设置；写在这里仅为可读性。
  spatial_dims: 2

  # 2D 模型显存友好，可加大通道数。
  encoder_channels: [32, 64, 128, 256, 256]
  encoder_blocks_per_stage: [3, 3, 9, 3, 3]    # 必须 == len(encoder_channels)
  decoder_blocks_per_stage: [2, 2, 2, 2]       # 必须 == len(encoder_channels) - 1
  # 2.5D 折叠模式合法值："basic" | "preact" | "bottleneck"。
  # ``r2plus1d``（方案 A，因子化 (2+1)D 残差块）需要 spatial_dims=3，即 D
  # 仍是真实空间轴。要在 2.5D 数据流上启用方案 A，请同时打开下面的
  # ``lift_2_5d_to_3d``（Plan A 升维开关）。否则只有 basic/preact/bottleneck
  # 合法。
  block_type: "basic"

  # ---- Plan A "升维"开关 ----
  # 默认 false（经典 2.5D 折叠路径，D 折入通道维，2D UNet + SliceChannelLoss）。
  # 设为 true 时：
  #   * trainer 跳过 (B, C_res, D, H, W) → (B, C_res*D, H, W) 的 squeeze；
  #     图像保持 (B, n_views, D, H, W) 进入真 3D UNet（spatial_dims 自动改为 3）。
  #   * 模型输入通道 = n_views = len(multi_res_scales)，每个 FOV 视图算一通道；
  #     输出 (B, num_fg, D, H, W)（单分辨率真 3D 分割）。
  #   * 损失走 MultiResolutionLoss(num_res=1) 而不是 SliceChannelLoss；
  #     ``loss.slice_loss_reduction`` 在 lift 模式下被忽略。
  #   * 仅 view 0（1× FOV）作为监督目标；wider FOV 仍作为输入通道喂给 stem
  #     （``context_fusion`` 仍生效），但不参与监督。
  # 推荐与 ``block_type: "r2plus1d"`` 配合，让 (2+1)D 因子化卷积获得真实
  # 的 z 方向上下文。
  # 限制：
  #   1. 与 data.aux_keep_native_d 互斥（folded-D 通道槽位 vs. 真 D 空间轴
  #      在物理布局上不兼容；Config.validate() 会显式拒绝）。
  #   2. 几何约束：``patch_size[0]`` (D) 必须能被 ``2**(len(encoder_channels)-1)``
  #      整除。Downsample 在每层把 D 也减半，5 stages 需 D≥16；4 stages 需 D≥8。
  #      经典 2.5D 折叠路径不受此约束（D 折入通道维），开 lift 时则会受。
  #      违反时 validate() 立即报错并给出具体修复建议。
  #
  # 与 ``aux_seg_supervision`` 正交支持（v2 起）：每个 aux head 输出
  # ``(B, num_fg, D, H, W)``（spatial_dims=3 自动产生 3D 1×1×1 conv），
  # 每视图 aux 损失走 MultiResolutionLoss(num_res=1) 而非 SliceChannelLoss。
  # 与 ``deep_supervision`` 也正交（DS 仅作用于主路径）。
  #
  # 推荐组合（典型起点）：
  #   patch_size: [16, 256, 256]
  #   encoder_channels: [32, 64, 128, 256, 256]
  #   block_type: "r2plus1d"
  #   lift_2_5d_to_3d: true
  #   aux_seg_supervision: true   # 可选：让 wider FOV 也被监督
  lift_2_5d_to_3d: false

  norm_type  : "instance"
  norm_groups: 8
  activation : "leakyrelu"
  dropout    : 0.0

  use_se: true
  attention_type: "none"
  skip_attention: false

  deep_supervision: false

  stem_mode    : "conv3"

  # 多 z-FOV 上下文融合策略（仅 patch_mode=2_5d 且 len(multi_res_scales)>1 生效）。
  #   "multi_stem_proj" — 方案 A。每个 view 独立 stem + 1×1 融合回 base 通道（早融合）。
  #   "hierarchical"    — 方案 C，推荐。view k 经 stride-2^k patchify stem 产出低分辨率
  #                        特征，cat 注入到 encoder stage k 入口（粗 FOV 进深层语义）。
  #                        约束：len(multi_res_scales) <= len(encoder_channels)，且
  #                              patch_size[1:] 能被 2^(n_views-1) 整除。
  #   "shared_stem"     — 单 stem 在 n_views*D 通道上跑（更省参，但物理异质共用滤波器）。
  context_fusion: "multi_stem_proj"

  # 多 z-FOV 辅助分割监督（仅 2.5D 且 len(multi_res_scales)>1 生效）。
  #   false  — 默认/旧行为：seghead 仅对 view 0（1× FOV）做预测，aux 视野
  #            仅作为 stem 输入辅助上下文（无显式监督）。
  #   true   — 强引导：seghead 额外为每个 aux view k=1..n_views-1 输出一份
  #            (B, num_fg*D, H, W) 预测，对应 dataset 里 view k 重采样回 D
  #            通道的 label 做监督。aux head 拓扑依据 context_fusion 自动选择：
  #              * multi_stem_proj / shared_stem (Plan A)：所有 aux head
  #                并联挂在最高分辨率的 decoder 特征上（与 stem 早融合对称）。
  #              * hierarchical (Plan C)：aux head k 挂在 dec_features[-1-k]，
  #                即与 encoder stage k 同语义深度的 decoder 特征上（与 stem
  #                stride-2^k 注入位置对称）。
  #            权重由 loss.aux_supervision_weights 控制。eval/predict 阶段
  #            模型仍只输出主预测张量，predictor 行为不变。
  aux_seg_supervision: true

  # Aux head 拓扑（仅 aux_seg_supervision=true 生效）。
  #   "linear" — 单层 1×1 conv（与 main head 等容量；推荐 Plan A）。
  #   "conv"   — 3×3 ConvNormAct + 1×1（推荐 Plan C：低分辨率特征处加一层
  #              空间聚合，更接近 "main head + decoder block" 的容量）。
  # 参数开销 < 网络总量 1%。
  aux_head_mode: "linear"

  decoder_type   : "unet"
  downsample_mode: "conv"
  upsample_mode  : "trilinear"
  skip_mode      : "cat"

  drop_path_rate: 0.0


# =====================================================================
# LOSS — 2.5D 走 SliceChannelLoss 包装；底层 base_loss 在 (B*D,1,H,W) 上
#        作为标准 2D 二值损失生效，所有 LossConfig 选项原样适用。
# =====================================================================
loss:
  name: "dice_focal"
  compound_weights: [1.0, 1.0]

  # 长度 = num_fg_classes（不含背景）。
  class_weights: [1.0, 1.0]

  # 与 z_axis/cubic 一致：按 label_values 全长（含 bg）一一对应。
  region_weights: [1.0, 4.0, 2.0]

  dice_smooth : 1.0e-5
  dice_squared: false

  focal_alpha: 0.5
  focal_gamma: 2.0

  tversky_alpha: 0.3
  tversky_beta : 0.7

  deep_supervision_weights: [1.0, 0.5, 0.25, 0.125]

  # 2.5D 专用：SliceChannelLoss 的 reduction 模式。
  #   "per_slice"  —— 默认/旧版行为：把 (B, num_fg*D, H, W) 拆为 (B*D, 1, H, W)
  #                   后逐切片计算 Dice/Tversky，仅在 (H, W) 上求和。
  #                   缺陷：空切片 Dice ≈ smooth/smooth ≈ 1，loss ≈ 0，
  #                   稀释梯度；不约束跨切片结构一致性。
  #   "per_volume" —— 推荐：把 pred 视作 (B, num_fg, D, H, W)，逐窗口做 3D
  #                   Dice/Tversky（在 (D, H, W) 上求和）。空切片不再"白送"，
  #                   隐式正则跨切片一致性。BCE/Focal/Lovász 数学等价不变。
  # 切换该开关只影响 Dice 系数家族的聚合域；class_weights / region_weights /
  # focal/tversky 超参 / deep_supervision 全部继续生效。
  slice_loss_reduction: "per_volume"

  # 多 z-FOV 辅助监督权重（仅 model.aux_seg_supervision=true 生效）。
  # 长度 = n_views - 1（即 aux view 数）。空列表 → 自动用 0.5^k 几何衰减
  # （n_views=3 → [0.5, 0.25]，n_views=4 → [0.5, 0.25, 0.125]）。
  # 训练总损失：
  #   L = L_main(view_0) + Σ_{k=1..K} w_k * L_aux(view_k)
  # 其中 L_aux 为同款 SliceChannelLoss（不走 deep supervision），与主损失
  # 共享 base_loss（dice_focal 等）与 slice_loss_reduction 设置。
  aux_supervision_weights: []


# =====================================================================
# TRAIN
# =====================================================================
train:
  epochs: 100

  optimizer   : "adamw"
  lr          : 1.0e-3
  weight_decay: 1.0e-4

  scheduler: "cosine"
  warmup_epochs: 5
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6

  grad_accum_steps: 1
  grad_clip_norm: 12.0

  use_amp  : true
  # bfloat16 强烈推荐：fp16 在 InstanceNorm 上偶发方差下溢导致 forward NaN
  # （即使 loss 端 clamp 也无法恢复 NaN）。bf16 指数范围 ≈ fp32，方差不会下溢，
  # 速度与 fp16 接近；trainer 自动对 bf16 关闭 GradScaler。
  # Ampere 及更新架构（含 RTX 3080 Ti）原生支持。
  amp_dtype: "auto"

  compile_mode: "default"

  use_ema  : true
  ema_decay: 0.999

  output_dir: "outputs/lung_bone_convnext"
  save_every: 10
  save_best_metric: "mean_dice"
  save_best_mode: "max"

  early_stopping: 15

  log_every: 10
  val_every: 1
  vis_every: 10

  seed: 42
  deterministic: false

  resume: "D:/codes/work-projects/SegTask/outputs/lung_bone_convnext/best_model.pth"

  # 仅加载模型权重做迁移学习初始化；不恢复 optimizer/scheduler/epoch/RNG。
  # 与 resume 同时设置时 resume 优先（pretrain 被忽略）。
  pretrain: ""
  pretrain_strict: false
  pretrain_load_ema: false


# =====================================================================
# PREDICT — 2.5D 推理走 z 轴滑窗，与 z_axis 几何完全一致；
#           内部对每个窗口 squeeze + 2D forward + reshape。
#           TTA 仅翻转 H/W（D 是 channel 轴，翻转会破坏物理 slice 顺序）。
# =====================================================================
predict:
  z_interleave_enabled: true
  # 可选：覆盖默认阈值/因子
  z_interleave_thresholds: [1.0, 1.5]
  z_interleave_factors: [3, 2, 1]
  z_overlap : 0.5
  blend_mode: "gaussian"
  batch_size: 4
  tta_flip  : false
  threshold : 0.5
  output_dir: "predictions"
  save_probabilities: false