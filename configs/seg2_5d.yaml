# 2.5D 配置：z_axis 取片 → (B,1,D,H,W)
# view 0 (前 D 通道) = 1× FOV 主线目标；输出 (B,num_fg*D,H,W) 由 SliceChannelLoss 拆分。
# 与 seg3d.yaml 差异：patch_mode='2_5d'
# 说明：model.in_channels / model.spatial_dims 为派生只读量；train.save_best_metric / train.save_best_mode 也由 save_best_criterion 派生，YAML 中不写。

data:
  image_suffix        : ".nii.gz"   # 图像后缀
  label_suffix        : ".nii.gz"   # 标注后缀
  bbox_suffix         : ".nii.gz"   # bbox 后缀
  region_weight_suffix: ".nii.gz"   # region weight 后缀
  npz_suffix          : ".npz"      # 预生成样本后缀

  # #### 样例 ####
  image_dir        : "F:/Totalsegmentator_dataset_v201/small_data/nii"
  label_dir        : "F:/Totalsegmentator_dataset_v201/small_data/mask"
  bbox_dir         : "F:/Totalsegmentator_dataset_v201/small_data/bbox"
  region_weight_dir: "F:/Totalsegmentator_dataset_v201/small_data/region_weight"
  npz_dir          : "F:/Totalsegmentator_dataset_v201/small_data/npz"

  # 第二批(粗标)预生成 npz 目录。空 => 单批金标准；非空 => 训练时金/粗按 mix_ratio 混合（副源仅训练，val 始终仅金标准）。
  npz_dir_secondary: ""
  npz_auto_build   : true     # 是否自动构建/更新 npz 索引
  mix_ratio        : [1, 1]   # 每 batch [金标准, 粗标] 整数权重比；仅 npz_dir_secondary 非空时生效。

  label_values: [0, 1]   # 标签值
  num_classes : 2        # 0 => 自动 = len(label_values)

  patch_size: [12, 256, 256]   # 2.5D patch：D=切片数/in_channels；典型 D=9/12/15, H/W=256/384
  patch_mode: "2_5d"           # 'z_axis' | 'cubic' | 'whole' | '2_5d'

  # 多 z-FOV 上下文。[0] 必须为 1.0（主线）；典型 [1.0]/[1.0,1.5,2.0]
  multi_res_scales    : [1.0, 1.5, 2.0]
  aug_oversample_ratio: 1.5               # oversample，仅放大 z 轴，空间有冗余供后续数据增强后中心剪裁

  # Z 边界窗口几何（scale=1.0 通道；z_axis/2.5D 生效）。
  #   'stretch'  — 边界不足 eD 时沿 z 拉伸；物理通道间距中心/边界不一致
  #   'edge_pad' — 推荐：edge-replicate 补齐到 eD；训练-推理几何严格一致
  z_boundary_mode: "edge_pad"  # 仅 z_axis/2.5D

  # 多 FOV 保持原生深度（仅 2.5D + n_views>1 + aux_seg_supervision=true 生效）。
  #   false — 每 view 重采样回 D；模型输入 (B,n_views*D,H,W)
  #   true  — 抽 max_scale cube 增强；trainer 中心裁出各 view 原生 D_k
  #           拼接为 (B,sum(D_k),H,W)；aux head k 预测 (B,num_fg*D_k,H,W) 对应原 D_k label
  # 锁定 z_boundary_mode='edge_pad'
  keep_native_view_depth: true

  intensity_min        : -1024.0
  intensity_max        : 1024.0
  normalize            : "minmax"   # 'minmax' | 'zscore'
  spacing_normalization: false      # 仅 spacing_normalization=true
  target_spacing       : null       # 仅 spacing_normalization=true
  global_mean          : 0.0        # 仅 normalize='zscore'
  global_std           : 1.0        # 仅 normalize='zscore'
  exclude_list         : ""         # 训练/验证排除列表路径

  val_ratio       : 0.2    # 验证集比例
  split_seed      : 42     # 划分随机种子
  stratified_split: true   # 是否按主前景类分层

  batch_size        : 4      # 训练 batch
  num_workers       : 4      # DataLoader worker 数
  persistent_workers: true   # 仅 num_workers>0
  prefetch_factor   : 4      # 仅 num_workers>0 时有效
  pin_memory        : true   # 是否 pin memory

  foreground_oversample_ratio: 0.3   # 前景中心采样概率
  samples_per_volume         : 8     # 每卷每 epoch 样本数
  val_grid_coverage          : false # 仅 val split；medium 验证 patch 位置改用确定性均匀网格（epoch 间指标更可比）

  cache_mode       : "memory"   # 'none' | 'memory'
  cache_max_volumes: 2          # 0 = 不限（可能 OOM）

augment:
  enabled                     : true            # 总开关
  inplace                     : false           # 就地增强快路径：跳过入口 clone，省一份 batch 体积瞬时显存
  intensity_clamp             : true            # 是否裁 HU
  wmap_interp_mode            : "nearest"       # 'nearest' | 'bilinear'

  random_flip_prob            : 0.2             # 随机翻转概率
  random_flip_axes            : [2, 3, 4]       # D,H,W；D-flip 仅训练阶段

  random_affine_prob          : 0.3             # 仿射概率
  random_rotate_range         : [-15.0, 15.0]   # degrees
  random_scale_range          : [0.85, 1.15]    # 缩放范围
  random_rotate_range_per_axis: null            # 仅需要按轴不同角度时启用
  random_affine_aspect_correct: true            # 是否做纵横比校正
  random_translate_range      : [-0.1, 0.1]     # 平移比例

  elastic_deform_prob         : 0.0             # 弹性变形概率
  elastic_deform_sigma        : 5.0             # 平滑度
  elastic_deform_alpha        : 1.0             # 幅度（体素）

  grid_dropout_prob           : 0.0             # 网格 dropout 概率
  grid_dropout_ratio          : 0.3             # 挖空比例
  grid_dropout_holes          : 4               # 挖空块数

  random_brightness_prob      : 0.3             # 亮度扰动概率
  random_brightness_range     : [-0.1, 0.1]     # 加性

  random_contrast_prob        : 0.3             # 对比度扰动概率
  random_contrast_range       : [0.8, 1.2]      # 乘性

  random_gamma_prob           : 0.2             # gamma 扰动概率
  random_gamma_range          : [0.8, 1.2]

  gaussian_noise_prob         : 0.2             # 高斯噪声概率
  gaussian_noise_std          : 0.09            # 噪声标准差

  gaussian_blur_prob          : 0.1             # 高斯模糊概率
  gaussian_blur_sigma         : [0.5, 1.5]      # 模糊 sigma

  simulate_lowres_prob        : 0.1             # 低分辨率模拟概率
  simulate_lowres_zoom        : [0.5, 1.0]      # 缩放范围


model:
  arch                    : "unet"                    # 'unet' | 'adm' | 'edm2'
  backbone                : "resnet"                  # 'resnet' | 'convnext' | 'mednext'
  encoder_channels        : [32, 64, 128, 256, 256]   # 编码器通道数
  blocks_per_level        : 2                         # 每级 block 数
  encoder_blocks_per_stage: [2, 2, 2, 2, 2]           # 长度 == len(encoder_channels)
  decoder_blocks_per_stage: [2, 2, 2, 2]              # 长度 == len(encoder_channels)-1
  resenc_preset           : "none"                    # 'none' | 'S' | 'M' | 'L' | 'XL'
  block_type              : "basic"                   # 仅 resnet；'basic' | 'preact' | 'bottleneck' | 'r2plus1d'(需 3D)
  lift_2_5d_to_3d         : false                     # 是否真的折叠成 3D
  norm_type               : "batch"                   # 'instance' | 'batch' | 'group'
  norm_groups             : 8                         # 仅 group norm
  activation              : "leakyrelu"               # 'leakyrelu' | 'gelu' | 'relu'
  dropout                 : 0.0                       # dropout 比例
  se_reduction            : 16                        # SE reduction ratio；仅 attention_type='se'
  attention_type          : "none"                    # 'none' | 'se' | 'eca' | 'cbam' | 'coord' | 'lka' | 'msca'
  skip_attention          : false                     # Skip 路 AttentionGate3D
  attn_gate_norm          : "batch"                   # 仅 skip_attention=true
  deep_supervision        : true                      # 多 decoder 层预测
  aux_seg_supervision     : true                      # 仅 2.5D；多 FOV 辅助监督
  aux_topo_head           : false                     # 仅 unet；打开后启用拓扑辅助头
  aux_topo_target         : "centerline"              # 仅 aux_topo_head=true
  aux_topo_head_mode      : "conv"                    # 仅 aux_topo_head=true
  aux_head_mode           : "conv"                    # 仅 aux_seg_supervision=true；2.5D 下表示 aux-seg head 结构
  stem_mode               : "dual"                    # 'conv3' | 'conv7' | 'dual' | 'patch2' | 'patch4'
  stem_fusion_mode        : "multi_stem_proj"         # 'multi_stem_proj' | 'hierarchical' | 'shared_stem'
  decoder_type            : "unet"                    # 'unet' | 'unetpp' | 'unet3p'
  unet3p_cat_channels     : 64                        # 仅 decoder_type='unet3p'
  downsample_mode         : "conv"                    # 'conv' | 'maxpool' | 'avgpool' | 'blurpool' | 'pixelunshuffle'
  upsample_mode           : "trilinear"               # 'transpose' | 'trilinear' | 'nearest' | 'pixelshuffle' | 'carafe' | 'dysample'
  upsample_norm_act       : true                      # 仅 trilinear/nearest
  skip_mode               : "cat"                     # 'cat' | 'add'
  anisotropic_pooling     : false                     # 按 patch_size 自动推导逐级 per-axis stride；2.5D 下仅作用于 H/W（通常无实质变化）
  downsample_strides      : []                        # 非空时显式覆盖自动推导；每项值∈{1,2}
  grad_checkpointing      : false                     # 是否启用梯度检查点
  grad_ckpt_encoder_stages: []                        # 仅 grad_checkpointing=true；逐 encoder stage 0/1，空=全部 stage
  drop_path_rate          : 0.0                       # 通用（训练时对残差分支做随机深度）
  grn_enabled             : false                     # 仅 backbone='convnext'/'mednext'

  # ---- ConvNeXt 专属（取消注释并把 backbone 改成 "convnext" 才生效） ----
  # convnext_layer_scale_init: 1.0e-6   # 层缩放初值
  # convnext_downsample_lnfirst: true   # 下采样前先 LN

  # ---- MedNeXt 专属（取消注释并把 backbone 改成 "mednext" 才生效） ----
  # mednext_expand_ratio: 4
  # mednext_kernel_size: 3
  # mednext_dilated_reparam: false
  # mednext_dilated_reparam_kernel_sizes: []
  # mednext_dilated_reparam_dilations: []

  # ---- 多感受野（空洞卷积多分支融合）MultiRF ----
  # 只在编码器深层+瓶颈开（高 ROI、低网格风险），split 等成本、concat_proj 融合，axes=hw 只在 H/W 膨胀。
  multirf_enabled        : true              # 是否启用多感受野
  multirf_dilations      : [1, 2, 3]         # 必须含 1（守门支路）
  multirf_mode           : "split"           # 'split' | 'parallel'
  multirf_fusion         : "concat_proj"     # 'concat_proj' | 'sum' | 'se'
  multirf_axes           : "hw"              # 'hw' | 'all'
  multirf_encoder_stages : [0, 0, 1, 1, 1]   # 编码器逐 stage（长度=len(encoder_channels)=5）
  multirf_decoder_stages : [0, 0, 0, 0]      # 解码器逐 level（长度=len(encoder_channels)-1=4）
  multirf_branch_norm_act: true              # split+group 时分支通道须能被 norm_groups 整除

  # 自注意力（仅 backbone='resnet' 且 arch='unet'；列表长度 = encoder_channels / encoder_channels-1）
  selfattn_enabled       : false       # 是否启用自注意力
  selfattn_type          : "softmax"   # 'softmax' | 'linear' | 'window' | 'grid'
  selfattn_num_heads     : 4
  selfattn_head_dim      : -1          # -1 表示自动
  selfattn_zero_init     : true        # 是否零初始化
  selfattn_rope          : false       # 是否启用 RoPE
  selfattn_ffn           : false       # 是否在注意力后接 FFN
  selfattn_ffn_ratio     : 4.0         # 仅 selfattn_ffn=true
  selfattn_window_size   : 7           # 仅 type='window'
  selfattn_grid_size     : 7           # 仅 type='grid'
  selfattn_encoder_stages: []          # 逐 stage 0/1，非空时长度需 = len(encoder_channels)
  selfattn_decoder_stages: []          # 逐 level 0/1，非空时长度需 = len(encoder_channels)-1

  # 仅 2.5D 且 arch 改为 "adm" / "edm2" 才生效。
  # adm_attention_levels: []
  # adm_num_heads: 4
  # adm_num_head_channels: -1
  # adm_linear_attention_levels: []
  # adm_linear_attention_num_heads: 4
  # adm_linear_attention_head_dim: 32
  # edm2_attention_levels: []
  # edm2_channels_per_head: 64
  # edm2_res_balance: 0.3
  # edm2_attn_balance: 0.3
  # edm2_concat_balance: 0.5
  # edm2_clip_act: 256.0

loss:
  name                    : "dice_focal"              # 'dice' | 'bce' | 'focal' | 'tversky' | 'gdl' | 'focal_tversky' | 'lovasz' | 'cldice' | 及复合项
  compound_weights        : [1.0, 1.0]                # [loss1_w, loss2_w] 仅 compound 使用
  class_weights           : [1.0, 1.0]                # 按前景类；长度 = 前景类数（空 = 均匀）
  region_weights          : [1.0, 4.0, 2.0]           # 按 label_values 全长（含 bg）
  dice_smooth             : 1.0e-5                    # 防 0/0
  dice_squared            : false                     # true → Dice^2
  focal_alpha             : 0.5                       # 正类权重
  focal_gamma             : 2.0                       # 难样本指数
  tversky_alpha           : 0.3                       # FP 权重
  tversky_beta            : 0.7                       # FN 权重
  batch_dice              : true                      # nnU-Net 风格 batch+空间聚合
  ignore_empty            : false                     # 仅 per-sample 时跳过缺失前景类
  gdl_weight_type         : "square"                  # 仅 loss.name 含 'gdl'；'square' | 'simple' | 'uniform'
  gdl_w_max               : 100000.0                  # 仅 loss.name 含 'gdl'
  focal_tversky_gamma     : 1.3333333333333333        # 仅 loss.name 含 'focal_tversky'
  lovasz_per_sample       : true                      # 仅 loss.name 含 'lovasz'
  cldice_iter             : 3                         # 仅 loss.name 含 'cldice'
  cldice_smooth           : 1.0                       # 仅 loss.name 含 'cldice'
  deep_supervision_weights: [1.0, 0.5, 0.25, 0.125]   # 深监督每层权重
  slice_loss_reduction    : "per_volume"              # 仅 2.5D
  aux_supervision_weights : []                        # 仅 2.5D + aux_seg_supervision=true；长度 = n_views-1
  aux_topo_weight         : 0.3                       # 仅 model.aux_topo_head=true
  aux_topo_iter           : 3                         # 仅 model.aux_topo_head=true
  aux_topo_loss           : "auto"                    # 仅 model.aux_topo_head=true

train:
  epochs                       : 2                # 训练轮数
  gpus                         : [0]              # 要用的物理卡号列表；len(gpus)>1 时才进入 DDP
  ddp_find_unused_parameters   : false            # 仅 len(gpus)>1
  ddp_static_graph             : true             # 仅 len(gpus)>1；计算图逐步固定时可开，免每步 unused-parameter 遍历（建议配 find_unused_parameters=false）
  ddp_gradient_as_bucket_view  : true             # 仅 len(gpus)>1；grad 直接作为通信 bucket 的 view，省约 1× 梯度显存（数学等价）
  ddp_master_port              : 0                # 仅 len(gpus)>1
  ddp_scale_dataloader_per_rank: true             # 仅 len(gpus)>1
  ddp_timeout_minutes          : 30               # 仅 len(gpus)>1
  zero_redundancy_optimizer    : true             # 仅 len(gpus)>1；ZeRO-1 优化器状态分片（数值严格等价），单卡忽略并告警
  val_every                    : 1                # 每隔多少 epoch 做验证
  optimizer                    : "adamw"          # 'adam' | 'adamw' | 'sgd'
  adamw_fused                  : true             # CUDA 下用 fused AdamW，单 kernel 更新全部参数
  lr                           : 1.0e-3
  weight_decay                 : 1.0e-4
  momentum                     : 0.99             # 仅 optimizer='sgd'
  nesterov                     : true             # 仅 optimizer='sgd'
  scheduler                    : "cosine"         # 'cosine' | 'cosine_warm_restarts' | 'poly' | 'step' | 'plateau' | 'one_cycle'
  warmup_epochs                : 5                # one_cycle 下必须 0（内置 pct_start）
  warmup_lr                    : 1.0e-6
  cosine_min_lr                : 1.0e-6           # 仅 scheduler in {'cosine','cosine_warm_restarts','one_cycle'}
  cosine_restart_period        : 50               # 仅 scheduler='cosine_warm_restarts'
  cosine_restart_mult          : 2                # 仅 scheduler='cosine_warm_restarts'
  poly_power                   : 0.9              # 仅 scheduler='poly'
  step_size                    : 50               # 仅 scheduler='step'
  step_gamma                   : 0.1              # 仅 scheduler='step'
  plateau_patience             : 10               # 仅 scheduler='plateau'
  plateau_factor               : 0.5              # 仅 scheduler='plateau'
  grad_accum_steps             : 1                # 等效 batch = batch_size * grad_accum_steps
  grad_clip_norm               : 12.0             # 0 = 禁用
  grad_norm_lazy_sync          : false            # 仅 fp16+GradScaler 且健康监控关闭时跳过范数的 D2H 同步（数值等价）
  use_amp                      : true             # 是否使用 AMP
  amp_dtype                    : "auto"           # 'auto' | 'bf16' | 'fp16' | 'fp32'；仅 use_amp=true
  compile_mode                 : "default"        # 'none' | 'default' | 'reduce-overhead' | 'max-autotune'
  channels_last                : false            # 是否启用 channels_last
  cuda_expandable_segments     : false            # CUDA allocator expandable segments，缓解形状多变场景的显存碎片
  val_empty_cache              : null             # 整卷验证前后 empty_cache；null=自动（high 开/medium 关）| true | false
  use_ema                      : true             # 是否启用 EMA
  ema_decay                    : 0.999            # 仅 use_ema=true
  ema_warmup                   : true             # 仅 use_ema=true
  ema_device                   : ""               # 仅 use_ema=true；""=跟随模型设备 | 'cpu'=shadow 常驻 pinned CPU，省 1× 参数显存（严格等价）
  swa_enabled                  : false            # SWA 尾段等权权重平均（与 EMA 正交可叠加）
  swa_start_ratio              : 0.75             # 仅 swa_enabled=true；开始平均的进度比例 (0,1)
  swa_bn_update_steps          : 50               # 仅 swa_enabled=true；收尾 BN 统计重估 batch 数（无 BN 自动跳过）
  output_dir                   : "outputs/base"
  save_every                   : 10               # 每隔多少 epoch 保存一次
  save_keep_last               : 3                # 保留最近多少个 checkpoint
  save_async                   : true             # 异步 checkpoint 保存（后台线程写盘，不阻塞训练；多占一份 CPU 内存快照）
  save_best_criterion          : "dice"           # 'loss' | 'dice' | 'iou' | 'mcc' | 'min_dice' | 'dice+surface_dice' | 'balanced'；save_best_metric/mode 由此派生
  surface_dice_tolerance       : 1                # 仅 criterion ∈ {dice+surface_dice, balanced}
  surface_dice_weight          : 0.5              # 仅 criterion='dice+surface_dice'
  save_best_preset             : ""               # 非空时覆盖上面三项；'lung'|'vessel'|'airway'|'bone_multi'|'lymph_node'|'lesion_small'|'oar_multi'|'heart_chamber'|'bone_lung_combined'
  val_metric_mode              : "medium"         # 'medium' | 'high'
  val_metric_bbox_crop         : false            # 仅 val_metric_mode='high'；指标计算前按 pred∪GT bbox 裁剪（严格等价，省算省显存）
  early_stopping               : 15               # 0 = 禁用
  log_every                    : 10               # 训练 loss 记录（micro-step）
  vis_every                    : 10               # 每隔多少 epoch 可视化一次
  seed                         : 42               # 随机种子
  deterministic                : false            # cudnn deterministic（慢）
  resume                       : ""               # 完整 state 恢复（model/optim/sched/ema/rng）
  pretrain                     : ""               # 仅加载权重做初始（迁移学习）；resume 优先
  pretrain_strict              : false            # false 允许 head 形状不一致
  pretrain_load_ema            : false            # ckpt 含 EMA 时是否优先取 shadow
  pretrain_upkern              : false            # 仅 backbone='mednext'；预训练深度卷积权重做 UpKern 插值
  reparam_deploy               : false            # 仅 backbone='mednext'；推理前将可重参数化深度卷积折叠为 deploy 形态

predict:
  z_interleave_enabled   : true            # 仅 2.5D；启用 z 轴 interleave 推理
  z_interleave_thresholds: [1.0, 1.5, 3]   # 覆盖默认阈值/因子；仅 z_interleave_enabled=true
  z_interleave_factors   : [4, 3, 2, 1]    # 覆盖默认阈值/因子；仅 z_interleave_enabled=true
  adabn_enabled          : true            # 仅测试时自适应 BatchNorm
  adabn_mode             : "global"        # 'global' | 'per_volume'
  adabn_num_volumes      : 8               # 仅 adabn_enabled=true 且 adabn_mode='global'
  z_overlap              : 0.5             # 滑窗重叠（0~0.95）
  blend_mode             : "gaussian"      # 'gaussian' | 'constant'
  batch_size             : 4               # 推理 batch
  tta_flip               : false           # 8× forward；仅翻 H/W
  tta_batch_size         : 1               # 仅 tta_flip=true
  threshold              : 0.5             # 前景类最大概率 < threshold 则归背景
  acc_dtype              : "fp32"          # 'fp32' | 'fp16'
  vol_dtype              : "fp32"          # 'fp32' | 'fp16'；GPU 常驻整卷张量存储精度（fp16 减半常驻显存，取窗时升回 fp32）
  accumulate_on_cpu      : false           # 是否在 CPU 累积推理结果
  cudnn_benchmark        : false           # 独立 CLI 推理开启 cudnn.benchmark（滑窗形状固定，首 batch 自动选优）
  use_inference_mode     : false           # 前向用 inference_mode 替代 no_grad（数值等价，纯提速；AdaBN 估计期自动回退）
  channels_last          : false           # 推理侧 channels_last 内存排布（数值等价，Ampere+ 可能提速，需 benchmark）
  skip_empty_windows     : false           # 滑窗跳过纯背景窗（归一化后窗内 max<=阈值 → 不前向，概率保持 0）
  skip_empty_threshold   : 0.0             # 仅 skip_empty_windows=true；跳窗判据（minmax 归一化下 0.0=整窗钳底空气）
  output_dir             : ""
  save_probabilities     : false           # 是否同时保存概率图

vis:
  enabled          : true                           # 设 true 即生成 HTML
  output_dir       : ""                             # 空 => train.output_dir/visualization/
  filename         : "pipeline_vis.html"
  flows            : ["data", "model", "predict"]   # 视图子集 + 标签页顺序
  trace_shapes     : true                           # 模型流 dummy 前向追踪真实形状
  max_detail_params: 200                            # 单节点详情最多条数

monitor:
  enabled                      : true                      # 设 true 即落盘 + 渲染仪表盘
  output_dir                   : ""                        # 空 => train.output_dir
  filename                     : "training_monitor.html"
  update_every                 : 1                         # 每多少 epoch 重渲染
  auto_reload_seconds          : 10                        # HTML 自动重载间隔（秒）
  run_name                     : ""                        # 对比页显示名；空 => output_dir 目录名
  compare_runs                 : []                        # 仅 monitor.enabled=true
  health_monitor               : true                      # 仅 monitor.enabled=true
  health_grad_norm_when_no_clip: true                      # 仅 monitor.enabled=true
  health_update_ratio          : false                     # 仅 monitor.enabled=true
