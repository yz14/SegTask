# 3D cubic 分类 reference 配置（backbone=segtask Encoder + GAP + 多标签 BCE）。
# 用法: python -m clstask.train --config configs/cls3d_cubic.yaml [--override key=val ...]
# 说明: model.in_channels / model.spatial_dims 为派生只读量（见 segtask_v1 topology）。
#   分类专属设置集中在顶层 cls: 段（见 clstask/config.py ClsConfig）。
#   mask 弱标签: 由分割 label 派生每前景类"是否出现"（volume 粒度）。

data:
  npz_suffix : ".npz"
  npz_dir    : "F:/LUNA25/cls_npz"     # image[+label] npz（label 供 mask 弱标签）
  npz_auto_build: false

  label_values: [0, 1]     # [bg, fg1, ...]；num_fg_classes = len-1 = 1
  num_classes : 2

  patch_size: [16, 128, 128]   # [D, H, W]
  patch_mode: "cubic"          # 3D 中心 cube
  multi_res_scales: [1.0]      # clstask 目前单分辨率

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio : 0.2
  split_seed: 42

  batch_size        : 4
  num_workers       : 4
  pin_memory        : true
  persistent_workers: true
  prefetch_factor   : 4
  foreground_oversample_ratio: 0.5
  samples_per_volume         : 8

augment:
  enabled: false           # true = 训练时 GPU 增强（复用 segtask GPUAugmentor，
                           # image+label 联合增强后派生 target；参数见 segtask augment 段）

model:
  backbone: "resnet"                        # segtask Encoder 用 ResNet block
  encoder_channels: [32, 64, 128, 256]
  encoder_blocks_per_stage: [2, 2, 2, 2]
  block_type: "basic"
  norm_type  : "instance"
  activation : "leakyrelu"
  stem_mode      : "conv3"

train:
  epochs: 50
  optimizer   : "adamw"
  lr          : 1.0e-3
  weight_decay: 1.0e-4
  scheduler    : "cosine"
  warmup_epochs: 2
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6
  grad_clip_norm: 12.0
  use_amp  : true
  amp_dtype: "auto"
  use_ema   : true
  ema_decay : 0.999
  ema_warmup: true         # 早期动态 decay，避免 shadow 被随机初值拖累
  ema_device: ""           # "cpu" = shadow 放 CPU 省显存
  output_dir: "outputs/cls3d_cubic"

cls:
  label_granularity: "volume"      # 体级分类
  label_source     : "mask"        # 由分割 mask 派生弱标签
  multi_label      : true
  backbone         : "encoder"     # 复用 segtask Encoder（SSL 权重可迁移）
  pooling          : "avg"
  head_hidden_dim  : 256
  head_dropout     : 0.0
  loss_type        : "bce"
  mixup_alpha      : 0.0
  cutmix_alpha     : 0.0
  # pretrained_ckpt: "outputs/ssl_genesis/ssl_best.pt"   # 可选：迁移 SSL encoder
  encoder_lr_mult  : 1.0
  agg_mode         : "mean"
  eval_patches_per_volume: 8
  save_best_metric : "vol_auc"  # 卷级 MIL 选模（与推理 agg_mode 同口径）；也可 auc/f1/acc/loss
