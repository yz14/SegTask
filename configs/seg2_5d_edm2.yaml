# 2.5D 分割 — EDM2 U-Net (Karras et al., CVPR 2024) 作分割 backbone:
#   Magnitude-preserving (MP) ops: MPConv + forced weight-norm, mp_silu, mp_sum,
#     mp_cat, pixel-norm; Block (去 noise/class emb), 可选 MP self-attn
#   Multi-FOV stem: MP-native (每 view MPConv → mp_cat → MPConv 1×1 fusion);
#     不支持 'hierarchical'
#   输出 (B, num_fg*D, H, W); MP seg-head + learnable out_gain
#   aux_seg_supervision (仅 Plan A) / deep_supervision 正交
#
# arch=='edm2' 时忽略: backbone/block_type/norm_type/activation/attention_type
#   /use_se/decoder_type/unet3p_cat_channels/resenc_preset/skip_attention
#   /skip_mode/upsample_mode/downsample_mode/drop_path_rate (论文固定)
# 生效字段: data.*, encoder_channels/encoder_blocks_per_stage/decoder_blocks_per_stage,
#   stem_fusion_mode, deep_supervision/aux_seg_supervision/aux_head_mode,
#   dropout (Block), edm2_attention_levels/channels_per_head,
#   edm2_res_balance/attn_balance/concat_balance/clip_act

data:
  image_suffix: ".nii.gz"
  label_suffix: ".nii.gz"
  bbox_suffix : ".nii.gz"
  region_weight_suffix: ".nii.gz"
  image_dir: "F:/BaiduNetdiskDownload/lung_nii"
  label_dir: "F:/BaiduNetdiskDownload/lung_bone"
  region_weight_dir: "F:/BaiduNetdiskDownload/lung_weight"
  bbox_dir : "F:/CT_data/airway_segment_data/bone_bbox"
  npz_dir: "F:/BaiduNetdiskDownload/lung_prep"

  label_values: [0, 1, 2]
  num_classes : 3

  patch_size: [12, 256, 256]
  patch_mode: "2_5d"

  multi_res_scales: [1.0, 1.5, 2.0]
  aug_oversample_ratio: 1.5

  z_boundary_mode: "edge_pad"
  keep_native_view_depth: true

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio : 0.2
  split_seed: 42
  stratified_split: true

  batch_size : 4
  num_workers: 4
  prefetch_factor: 4
  pin_memory : true

  foreground_oversample_ratio: 0.3
  samples_per_volume: 8

  cache_mode: "memory"
  cache_max_volumes: 2


augment:
  enabled: true
  random_flip_prob: 0.5
  random_flip_axes: [2, 3, 4]
  random_affine_prob : 0.3
  random_rotate_range: [-15.0, 15.0]
  random_scale_range : [0.85, 1.15]
  elastic_deform_prob : 0.0
  elastic_deform_sigma: 5.0
  elastic_deform_alpha: 1.0
  random_brightness_prob : 0.3
  random_brightness_range: [-0.1, 0.1]
  random_contrast_prob : 0.3
  random_contrast_range: [0.8, 1.2]
  random_gamma_prob : 0.2
  random_gamma_range: [0.8, 1.2]
  gaussian_noise_prob: 0.2
  gaussian_noise_std : 0.09
  gaussian_blur_prob : 0.1
  gaussian_blur_sigma: [0.5, 1.5]
  simulate_lowres_prob: 0.1
  simulate_lowres_zoom: [0.5, 1.0]


# MODEL — EDM2 U-Net
model:
  arch: "edm2"

  # 与 seg2_5d 宽度一致 (mults [1,2,4,8,8], base=32); EDM2 论文 256² 典型 [1,2,3,4]
  encoder_channels: [32, 64, 128, 256, 256]
  encoder_blocks_per_stage: [3, 3, 3, 3, 3]   # 论文默认 num_blocks=3
  # EDM2 忽略 (decoder 块数由 skip-stack 固定: nb_k+1)
  decoder_blocks_per_stage: [3, 3, 3, 3]

  stem_mode: "conv3"                    # EDM2 忽略 (使用 3×3 MPConv stem)
  stem_fusion_mode: "multi_stem_proj"     # 'shared_stem' | 'multi_stem_proj' (不支持 hierarchical)

  deep_supervision: false
  aux_seg_supervision: true
  aux_head_mode: "linear"

  dropout: 0.0                          # 复用为 Block mid-residual dropout

  # EDM2 专属; 默认仅最深一级。[3,4] = 同时二、最深两级 (额外容量时)
  edm2_attention_levels: [4]
  edm2_channels_per_head: 64
  edm2_res_balance: 0.3
  edm2_attn_balance: 0.3
  edm2_concat_balance: 0.5
  edm2_clip_act: 256.0


loss:
  name: "dice_focal"
  compound_weights: [1.0, 1.0]
  class_weights: [1.0, 1.0]
  region_weights: [1.0, 4.0, 2.0]
  dice_smooth : 1.0e-5
  dice_squared: false
  focal_alpha: 0.5
  focal_gamma: 2.0
  tversky_alpha: 0.3
  tversky_beta : 0.7
  deep_supervision_weights: [1.0, 0.5, 0.25, 0.125]
  slice_loss_reduction: "per_volume"
  aux_supervision_weights: []


train:
  epochs: 100

  optimizer   : "adamw"
  lr          : 1.0e-3
  weight_decay: 1.0e-4

  scheduler: "cosine"
  warmup_epochs: 5
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6

  grad_accum_steps: 1
  grad_clip_norm: 12.0

  use_amp  : true
  amp_dtype: "auto"

  compile_mode: "default"

  use_ema  : true
  ema_decay: 0.999

  output_dir: "outputs/lung_bone_edm2"
  save_every: 10
  # 选模标准：唯一接口；save_best_metric/mode 由此自动派生。
  save_best_criterion: "dice"

  early_stopping: 15

  log_every: 10
  val_every: 1
  vis_every: 10

  seed: 42
  deterministic: false


predict:
  z_interleave_enabled: true
  z_interleave_thresholds: [1.0, 1.5]
  z_interleave_factors: [3, 2, 1]
  z_overlap : 0.5
  blend_mode: "gaussian"
  batch_size: 4
  tta_flip  : false
  threshold : 0.5
  output_dir: "predictions"
  save_probabilities: false
