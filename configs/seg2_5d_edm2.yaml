# ============================================================================
# 2.5D Segmentation Configuration — EDM2 U-Net arch
#
# Paper-faithful EDM2 U-Net (Karras et al., CVPR 2024) adapted as a
# segmentation backbone:
#   - Magnitude-preserving (MP) ops: MPConv with forced weight
#     normalization, mp_silu (SiLU/0.596), mp_sum, mp_cat, pixel-norm.
#   - Block (no-emb variant) with optional MP self-attention; noise/class
#     embedding paths from the original diffusion model are removed.
#   - Multi-FOV stem uses an MP-native variant (per-view MPConv → mp_cat
#     → MPConv 1×1 fusion). 'hierarchical' fusion is NOT supported.
#   - Output: (B, num_fg * D, H, W); MP seg-head with learnable out_gain.
#   - aux_seg_supervision (Plan A only) and deep_supervision compose.
#
# IGNORED fields when arch == "edm2":
#   model.backbone / model.block_type / model.norm_type / model.activation
#   model.attention_type / model.use_se / model.decoder_type
#   model.unet3p_cat_channels / model.resenc_preset / model.skip_attention
#   model.skip_mode / model.upsample_mode / model.downsample_mode
#   model.drop_path_rate / model.convnext_*  (paper fixes the internals).
#
# HONOURED fields:
#   data.* (full pipeline)
#   model.encoder_channels / encoder_blocks_per_stage / decoder_blocks_per_stage
#   model.context_fusion (shared_stem | multi_stem_proj)
#   model.deep_supervision / aux_seg_supervision / aux_head_mode
#   model.dropout (reused as Block dropout)
#   model.edm2_attention_levels / edm2_channels_per_head
#   model.edm2_res_balance / edm2_attn_balance / edm2_concat_balance
#   model.edm2_clip_act
# ============================================================================

# =====================================================================
# DATA
# =====================================================================
data:
  image_suffix: ".nii.gz"
  label_suffix: ".nii.gz"
  bbox_suffix : ".nii.gz"
  region_weight_suffix: ".nii.gz"
  image_dir: "F:/BaiduNetdiskDownload/lung_nii"
  label_dir: "F:/BaiduNetdiskDownload/lung_bone"
  region_weight_dir: "F:/BaiduNetdiskDownload/lung_weight"
  bbox_dir : "F:/CT_data/airway_segment_data/bone_bbox"
  npz_dir: "F:/BaiduNetdiskDownload/lung_prep"

  label_values: [0, 1, 2]
  num_classes : 3

  patch_size: [12, 256, 256]
  patch_mode: "2_5d"

  multi_res_scales: [1.0, 1.5, 2.0]
  aug_oversample_ratio: 1.5

  z_boundary_mode: "edge_pad"
  aux_keep_native_d: true

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio : 0.2
  split_seed: 42
  stratified_split: true

  batch_size : 4
  num_workers: 4
  prefetch_factor: 4
  pin_memory : true

  foreground_oversample_ratio: 0.3
  samples_per_volume: 8

  cache_mode: "memory"
  cache_max_volumes: 2


# =====================================================================
# AUGMENT
# =====================================================================
augment:
  enabled: true
  random_flip_prob: 0.5
  random_flip_axes: [2, 3, 4]
  random_affine_prob : 0.3
  random_rotate_range: [-15.0, 15.0]
  random_scale_range : [0.85, 1.15]
  elastic_deform_prob : 0.0
  elastic_deform_sigma: 5.0
  elastic_deform_alpha: 1.0
  random_brightness_prob : 0.3
  random_brightness_range: [-0.1, 0.1]
  random_contrast_prob : 0.3
  random_contrast_range: [0.8, 1.2]
  random_gamma_prob : 0.2
  random_gamma_range: [0.8, 1.2]
  gaussian_noise_prob: 0.2
  gaussian_noise_std : 0.09
  gaussian_blur_prob : 0.1
  gaussian_blur_sigma: [0.5, 1.5]
  simulate_lowres_prob: 0.1
  simulate_lowres_zoom: [0.5, 1.0]


# =====================================================================
# MODEL — EDM2 U-Net
# =====================================================================
model:
  arch: "edm2"

  # EDM2 paper's typical channel_mult for 256² is [1,2,3,4]; we keep the
  # widths in line with seg2_5d.yaml for fair comparison (model_channels
  # = 32 base, mults [1,2,4,8,8] gives the same progression).
  encoder_channels: [32, 64, 128, 256, 256]
  encoder_blocks_per_stage: [3, 3, 3, 3, 3]   # EDM2 paper default num_blocks=3
  # IGNORED for EDM2 (see ADM yaml for the same caveat). Decoder per-level
  # count is fixed at ``nb_k + 1`` by the paper's skip topology.
  decoder_blocks_per_stage: [3, 3, 3, 3]

  # ``stem_mode`` is ignored for EDM2 (paper uses a 3×3 MPConv stem;
  # the multi-FOV variant uses per-view 3×3 MPConv + mp_cat + 1×1 fusion).
  # Kept for config schema consistency.
  stem_mode: "conv3"
  context_fusion: "multi_stem_proj"

  deep_supervision: false
  aux_seg_supervision: true
  aux_head_mode: "linear"

  # Reused as Block dropout. EDM2's Block applies dropout to the
  # mid-residual feature when training (see networks_edm2.Block.forward).
  dropout: 0.0

  # EDM2-specific:
  # Default = deepest level only. Set [3, 4] to also attend the second-
  # deepest stage if model capacity allows.
  edm2_attention_levels: [4]
  edm2_channels_per_head: 64
  edm2_res_balance: 0.3
  edm2_attn_balance: 0.3
  edm2_concat_balance: 0.5
  edm2_clip_act: 256.0


# =====================================================================
# LOSS
# =====================================================================
loss:
  name: "dice_focal"
  compound_weights: [1.0, 1.0]
  class_weights: [1.0, 1.0]
  region_weights: [1.0, 4.0, 2.0]
  dice_smooth : 1.0e-5
  dice_squared: false
  focal_alpha: 0.5
  focal_gamma: 2.0
  tversky_alpha: 0.3
  tversky_beta : 0.7
  deep_supervision_weights: [1.0, 0.5, 0.25, 0.125]
  slice_loss_reduction: "per_volume"
  aux_supervision_weights: []


# =====================================================================
# TRAIN
# =====================================================================
train:
  epochs: 100

  optimizer   : "adamw"
  lr          : 1.0e-3
  weight_decay: 1.0e-4

  scheduler: "cosine"
  warmup_epochs: 5
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6

  grad_accum_steps: 1
  grad_clip_norm: 12.0

  use_amp  : true
  amp_dtype: "auto"

  compile_mode: "default"

  use_ema  : true
  ema_decay: 0.999

  output_dir: "outputs/lung_bone_edm2"
  save_every: 10
  save_best_metric: "mean_dice"
  save_best_mode: "max"

  early_stopping: 15

  log_every: 10
  val_every: 1
  vis_every: 10

  seed: 42
  deterministic: false


# =====================================================================
# PREDICT
# =====================================================================
predict:
  z_interleave_enabled: true
  z_interleave_thresholds: [1.0, 1.5]
  z_interleave_factors: [3, 2, 1]
  z_overlap : 0.5
  blend_mode: "gaussian"
  batch_size: 4
  tta_flip  : false
  threshold : 0.5
  output_dir: "predictions"
  save_probabilities: false
