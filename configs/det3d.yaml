# 3D 检测 reference 配置（3D anchor + 自实现 3D NMS/ROIAlign）。
# 用法: python -m dettask.train --config configs/det3d.yaml [--override key=val ...]
# 说明: patch_mode=cubic => spatial_dims=3, in_channels=1；框 [z1,y1,x1,z2,y2,x2]。
#   推理端三轴滑窗 + 跨窗 3D NMS → 体级 FROC。

data:
  npz_suffix : ".npz"
  npz_dir    : "F:/LUNA25/det_npz"
  npz_auto_build: false

  label_values: [0, 1]

  patch_size: [64, 96, 96]
  patch_mode: "cubic"
  multi_res_scales: [1.0]
  z_boundary_mode: "edge_pad"

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio : 0.2
  split_seed: 42

  batch_size        : 2
  num_workers       : 4
  pin_memory        : true
  persistent_workers: true
  prefetch_factor   : 4
  foreground_oversample_ratio: 0.5
  samples_per_volume         : 8

augment:
  enabled: false

model:
  backbone: "resnet"
  encoder_channels: [32, 64, 128, 256]
  encoder_blocks_per_stage: [2, 2, 2, 2]
  block_type: "basic"
  norm_type  : "instance"
  activation : "leakyrelu"
  stem_mode      : "conv3"

train:
  epochs: 50
  optimizer   : "adamw"
  lr          : 1.0e-4
  weight_decay: 1.0e-4
  scheduler    : "cosine"
  warmup_epochs: 2
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6
  grad_clip_norm: 12.0
  use_amp  : true
  amp_dtype: "auto"
  use_ema  : true
  ema_decay: 0.999
  output_dir: "outputs/det3d"

det:
  arch          : "retinanet"    # retinanet | fcos | faster_rcnn | detr
  boxes_from_mask: true
  fpn_channels  : 128
  fpn_levels    : []
  anchor_ratios : [0.5, 1.0, 2.0]
  anchor_scales : [1.0, 1.26]
  anchor_z_scales: [0.5, 1.0]    # 3D: z 尺寸 = 基础尺寸 × z_scale
  assigner      : "iou"
  pos_iou       : 0.3            # 3D IoU 天然更低
  neg_iou       : 0.2
  reg_loss      : "giou"
  score_thresh  : 0.05
  nms_iou       : 0.3
  max_dets      : 50
  eval_iou_thresh: 0.1
  # pretrained_ckpt: "outputs/ssl_3d/ssl_best.pt"
  encoder_lr_mult : 1.0
  save_best_metric: "map"
