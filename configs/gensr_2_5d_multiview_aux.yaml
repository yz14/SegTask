# 2.5D 超分（生成任务）— 多视图辅助重建监督（Plan A）
#
# 该配置演示多 FOV / 多视图辅助重建：
#   - data.multi_res_scales > 1 个尺度，且全部 >= 1.0
#   - model.aux_seg_supervision: true
#   - loss.aux_recon_weights: 可显式给出每个辅助视图权重
# 语义上 aux_seg_supervision 仍保留旧 YAML 键名，但当前表示“辅助重建监督”。

data:
  image_suffix: ".nii.gz"
  label_suffix: ".nii.gz"

  # 训练 / 推理目录（按本机修改）
  image_dir: "F:/med_data/imgs"
  label_dir: "F:/med_data/lbls"   # 生成任务忽略标签，但 loader 仍需该字段

  label_values: [0, 1]
  num_classes : 2

  patch_size: [12, 320, 400]
  patch_mode: "2_5d"

  # 多视图辅助重建：view 0 为主视图，view 1..n-1 为辅助视图。
  # 这里使用 larger-FOV auxiliary view；所有 scale 必须 >= 1.0。
  multi_res_scales: [1.0, 2.0]
  z_boundary_mode: "edge_pad"   # 多视图 larger-FOV 需要 edge_pad 保持物理 FOV
  aug_oversample_ratio: 1.0

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio : 0.2
  split_seed: 42

  batch_size : 4
  num_workers: 4
  pin_memory : true

  samples_per_volume: 8
  cache_mode: "memory"
  cache_max_volumes: 2

model:
  arch                    : "unet"
  encoder_channels        : [32, 64, 128, 256]
  encoder_blocks_per_stage: [2, 2, 2, 2]
  aux_seg_supervision     : true

  unet:
    backbone    : "resnet"
    decoder_type: "unet"
loss:
  # 辅助视图损失权重；空列表则按 0.5^k 自动回退。
  aux_recon_weights: [1.0]


# ---- 生成任务设置 ----
task:
  type: "generation"
  algorithm: "regression"
  degradation: "superres"
  out_channels: 1

  # 超分退化：下采样倍率与插值核
  sr_scale: 2
  sr_kernel: "area"
  sr_noise_std: 0.0

  # 回归算法
  residual: false
  recon_loss: "charbonnier"
  charbonnier_eps: 1.0e-3
  ssim_weight: 0.1           # 0 关闭；>0 加 (1−SSIM) 辅助
  grad_weight: 0.0

train:
  epochs: 100
  optimizer   : "adamw"
  lr          : 2.0e-4
  weight_decay: 1.0e-4
  scheduler: "cosine"
  warmup_epochs: 5
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6
  grad_clip_norm: 1.0
  use_amp  : true
  amp_dtype: "auto"
  compile_mode: "none"
  use_ema  : true
  ema_decay: 0.999
  output_dir: "outputs/gensr_multiview_aux"
  log_every: 20
  seed: 42


predict:
  output_dir: "predictions_sr_multiview_aux"
