data:
  image_suffix: ".nii.gz"
  label_suffix: ".nii.gz"
  bbox_suffix : ".nii.gz"
  region_weight_suffix: ".nii.gz"
  image_dir: "F:/airway_segment_with_img/imgs"
  label_dir: ""
  region_weight_dir: ""
  bbox_dir : ""
  npz_dir: ""
  label_values: [0, 1]
  num_classes : 2
  patch_size: [12, 256, 256]
  patch_mode: "2_5d"
  multi_res_scales: [1.0, 1.5, 2.0]
  aug_oversample_ratio: 1.5
  z_boundary_mode: "stretch"
  aux_keep_native_d: true
  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"
  val_ratio : 0.2
  split_seed: 42
  stratified_split: true
  batch_size : 8
  num_workers: 24
  prefetch_factor: 8
  pin_memory : true
  foreground_oversample_ratio: 0.3
  samples_per_volume: 8
  cache_mode: "memory"
  cache_max_volumes: 24


# AUGMENT — 3D 增强器在 squeeze 前作用于 (B,1,D,H,W); 2.5D 语义与 seg3d 一致
augment:
  enabled: true

  random_flip_prob: 0.2
  random_flip_axes: [2, 3, 4]   # D,H,W; D-flip 仅训练阶段

  random_affine_prob : 0.3
  random_rotate_range: [-15.0, 15.0]
  random_scale_range : [0.85, 1.15]

  elastic_deform_prob : 0.0
  elastic_deform_sigma: 5.0
  elastic_deform_alpha: 1.0

  random_brightness_prob : 0.3
  random_brightness_range: [-0.1, 0.1]

  random_contrast_prob : 0.3
  random_contrast_range: [0.8, 1.2]

  random_gamma_prob : 0.2
  random_gamma_range: [0.8, 1.2]

  gaussian_noise_prob: 0.2
  gaussian_noise_std : 0.09

  gaussian_blur_prob : 0.1
  gaussian_blur_sigma: [0.5, 1.5]

  simulate_lowres_prob: 0.1
  simulate_lowres_zoom: [0.5, 1.0]


# MODEL — 详细说明见 configs/seg2_5d.yaml
model:
  backbone: "convnext"
  encoder_channels: [32, 64, 128, 256, 256]
  encoder_blocks_per_stage: [3, 3, 9, 3, 3]
  decoder_blocks_per_stage: [2, 2, 2, 2]
  # 'basic'(默认) | 'preact' | 'bottleneck' | 'r2plus1d'(需 lift_2_5d_to_3d=true)
  block_type: "basic"

  # Plan A 升维: false=折叠 (2D + SliceChannelLoss); true=真 3D (与 aux_keep_native_d 互斥)
  lift_2_5d_to_3d: false

  norm_type  : "instance"
  norm_groups: 8
  activation : "leakyrelu"
  dropout    : 0.0

  use_se: true
  attention_type: "none"
  skip_attention: false

  deep_supervision: false

  stem_mode    : "conv7"          # 'conv1' | 'conv3' | 'conv7' | 'patchify'

  # 'multi_stem_proj' (Plan A, 早融合) | 'hierarchical' (Plan C) | 'shared_stem'
  context_fusion: "multi_stem_proj"

  aux_seg_supervision: true       # 多 FOV 辅助分割监督 (仅 2_5d + n_views>1)
  aux_head_mode: "linear"         # 'linear' (Plan A) | 'conv' (Plan C)

  decoder_type   : "unet"
  downsample_mode: "conv"
  upsample_mode  : "trilinear"
  skip_mode      : "cat"

  drop_path_rate: 0.0


# LOSS — 2.5D 走 SliceChannelLoss，base_loss 在 (B*D,1,H,W) 作 2D 二值损失
loss:
  name: "dice_focal"
  compound_weights: [1.0, 1.0]

  class_weights: [1.0]            # 长 = num_fg_classes (不含 bg)
  region_weights: [1.0, 4.0]      # 按 label_values 全长 (含 bg)

  dice_smooth : 1.0e-5
  dice_squared: false

  focal_alpha: 0.5
  focal_gamma: 2.0

  tversky_alpha: 0.3
  tversky_beta : 0.7

  deep_supervision_weights: [1.0, 0.5, 0.25, 0.125]

  # 'per_slice' (旧, 空切片 Dice≈1 稀释梯度) | 'per_volume' (推荐, 3D Dice, 隐式 z 正则)
  slice_loss_reduction: "per_volume"

  # 辅助监督权重 (长 = n_views-1)。空 → 0.5^k 自动衰减。L_aux 不走 deep supervision
  aux_supervision_weights: []


train:
  epochs: 100

  optimizer   : "adamw"
  lr          : 1.0e-3
  weight_decay: 1.0e-4

  scheduler: "cosine"
  warmup_epochs: 5
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6

  grad_accum_steps: 1
  grad_clip_norm: 12.0

  use_amp  : true
  # 'auto' (推荐 bf16) | 'bf16' | 'fp16' | 'fp32'; bf16 避免 IN 方差下溢 NaN
  amp_dtype: "auto"

  compile_mode: "default"

  use_ema  : true
  ema_decay: 0.999

  output_dir: "outputs/body_convnext"
  save_every: 10
  save_best_metric: "mean_dice"
  save_best_mode: "max"

  early_stopping: 15

  log_every: 10
  val_every: 1
  vis_every: 10

  seed: 42
  deterministic: false

  resume: ""

  # 仅加载权重作迁移学习 (不恢复 optim/sched/epoch/RNG); resume 优先
  pretrain: ""
  pretrain_strict: false
  pretrain_load_ema: false


# PREDICT — z 轴滑窗 (几何同 z_axis); TTA 仅翻 H/W (D 是 channel 轴)
predict:
  z_interleave_enabled: false
  z_interleave_thresholds: [1.0, 1.5]
  z_interleave_factors: [3, 2, 1]
  z_overlap : 0.5
  blend_mode: "gaussian"          # 'gaussian' | 'constant'
  batch_size: 4
  tta_flip  : false
  threshold : 0.5
  output_dir: "predictions"
  save_probabilities: false