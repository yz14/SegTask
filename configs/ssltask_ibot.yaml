# 自监督预训练（ssltask, iBOT/DINOv2⑥：DINO④ 全局蒸馏 + iBOT 掩码密集特征预测）示例配置。
# 运行：  python -m ssltask.pretrain --config configs/ssltask_ibot.yaml
# 产出：  outputs/ssltask_ibot/ssl_best.pt
# 衔接：  下游分割/分类训练加 --override train.pretrain=outputs/ssltask_ibot/ssl_best.pt
#         下游 _load_pretrain 非严格加载：encoder.* 命中；decoder.*/seg_head.* 随机
#         （与 DINO 一样只预训练 encoder；导出的是 **教师** encoder）。
#
# 相对 ④DINO 多一个变量：在 DINO 图像级损失外加 iBOT 掩码密集特征预测——遮住学生输入
# 的若干单元，对每个被遮位点要求学生密集特征匹配教师（看完整输入）该位点密集特征，
# 以共享/独立原型上的逐位点 softmax 交叉熵实现（配 centering + sharpening）。预期是
# 分类与分割双强的单一模型。其余几何/优化项与 ssltask_dino.yaml 保持一致以便受控对比。
#
# 重要：要让 encoder 权重 1:1 迁移，下游 config 的 `model:` 段应与本文件一致。

data:
  npz_dir: "F:/LUNA25/ssl_npz"
  npz_suffix: ".npz"

  label_values: [0, 1]                 # 仅用于 segtask Config 校验；SSL 不读 label
  num_classes : 2

  patch_size: [96, 112, 112]
  patch_mode: "cubic"

  multi_res_scales    : [1.0]          # SSL 单视图（必须长度 1）
  aug_oversample_ratio: 1.0

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  batch_size     : 2
  num_workers    : 16
  prefetch_factor: 8
  pin_memory     : true

  samples_per_volume: 8


augment:
  enabled: false                       # DINO 视图增广在方法内（多裁剪 + 翻转 + 强度抖动）


model:
  backbone: "resnet"
  encoder_channels: [64, 64, 128, 256, 512]
  encoder_blocks_per_stage: [2, 2, 2, 2, 2]
  decoder_blocks_per_stage: [2, 2, 2, 2]
  block_type: "basic"

  norm_type  : "instance"
  norm_groups: 8
  activation : "leakyrelu"
  dropout    : 0.0

  attention_type: "none"
  skip_attention: true

  # 以下头在 SSL 阶段被丢弃（仅预训练 encoder）；列出以便与下游对齐。
  deep_supervision   : false
  aux_seg_supervision: false
  aux_topo_head      : false

  stem_mode      : "conv3"
  decoder_type   : "unet"
  downsample_mode: "conv"
  upsample_mode  : "trilinear"
  skip_mode      : "cat"


# 优化器/调度器/AMP/output_dir/epochs/lr 由 SSL 复用 segtask train.*。
train:
  epochs: 300

  optimizer   : "adamw"
  lr          : 5.0e-4
  weight_decay: 4.0e-2                  # DINO 用较大 weight decay

  scheduler    : "cosine"
  warmup_epochs: 10
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6

  grad_accum_steps: 4
  grad_clip_norm  : 3.0                 # DINO 推荐裁剪到 ~3

  use_amp  : false
  amp_dtype: "auto"

  compile_mode: "none"

  use_ema  : false                      # DINO 教师即 EMA；关闭训练器级 EMA
  ema_decay: 0.999

  output_dir: "outputs/ssltask_ibot"

  log_every: 10

  seed: 42
  deterministic: false


ssl:
  method: "ibot"

  # 投影头（全局 DINO 头；iBOT 密集头复用同一组维度）
  dino_out_dim       : 4096
  dino_hidden_dim    : 2048
  dino_bottleneck_dim: 256
  dino_head_layers   : 3
  dino_head_use_bn   : false

  # 多裁剪（global_size/local_size 留空=由 patch_size 推导：global=patch，local≈半）
  dino_global_crops: 2
  dino_local_crops : 6
  dino_global_scale: [0.5, 1.0]
  dino_local_scale : [0.15, 0.5]

  # 视图增广
  dino_flip_prob      : 0.5
  dino_intensity_scale: 0.1
  dino_intensity_shift: 0.1

  # 温度（教师 warmup 0.04→0.07）+ centering + 教师 EMA 动量（cosine 0.996→1.0）
  dino_student_temp            : 0.1
  dino_teacher_temp            : 0.07
  dino_teacher_temp_warmup     : 0.04
  dino_warmup_teacher_temp_frac: 0.3
  dino_center_momentum         : 0.9
  dino_momentum_base           : 0.996
  dino_momentum_final          : 1.0

  # --- iBOT 掩码密集特征预测（方案⑥专用）---
  ibot_weight       : 1.0              # iBOT 损失权重 λ（L = L_DINO + λ·L_iBOT）
  ibot_mask_ratio   : 0.4              # 学生输入掩码比例（0.3–0.5）
  ibot_mask_unit    : 16              # 掩码单元边长（体素），与总下采样步长对齐
  ibot_feature_level: -1              # iBOT 取的 encoder 特征级（-1=瓶颈）
  ibot_out_dim      : 0               # iBOT 密集头原型数（0=复用 dino_out_dim）
  ibot_share_head   : false           # false=独立 iBOT 头（DINOv2 默认）；true=与全局头共享

  # 在线分割线性探针（§0.5）：强烈建议开启以按 Dice 选 best。
  # probe_enabled           : true
  # probe_data_dir          : "F:/LUNA25/probe_npz"
  # probe_every             : 10
  # probe_iters             : 200
  # probe_select_best       : true

  save_every: 10
