data:
  image_suffix: ".nii.gz"
  label_suffix: "-seg.nii.gz"
  bbox_suffix : "_pred.nii.gz"
  region_weight_suffix: ".nii.gz"

  image_dir: "F:/LUNA25/imgs"
  bbox_dir : "F:/LUNA25/lung_base"

  label_values: [0, 1]
  num_classes : 2

  patch_size: [12, 320, 400]  ##################################################################
  patch_mode: "2_5d"          ##################################################################

  multi_res_scales    : [1.0, 1.5, 2.0]
  aug_oversample_ratio: 1.5

  z_boundary_mode: "edge_pad"

  keep_native_view_depth: true

  intensity_min: -1024.0
  intensity_max: 1024.0
  normalize    : "minmax"

  val_ratio       : 0.2
  split_seed      : 42
  stratified_split: true

  batch_size     : 8
  num_workers    : 16
  prefetch_factor: 8
  pin_memory     : true

  foreground_oversample_ratio: 0.5
  samples_per_volume         : 8

  cache_mode       : "memory"
  cache_max_volumes: 12


augment:
  enabled: true

  random_flip_prob: 0.2
  random_flip_axes: [2, 3, 4]

  random_affine_prob : 0.3
  random_rotate_range: [-20.0, 20.0]
  random_scale_range : [0.80, 1.2]

  elastic_deform_prob : 0.0
  elastic_deform_sigma: 5.0
  elastic_deform_alpha: 1.0

  random_brightness_prob : 0.3
  random_brightness_range: [-0.1, 0.1]

  random_contrast_prob : 0.3
  random_contrast_range: [0.8, 1.2]

  random_gamma_prob : 0.2
  random_gamma_range: [0.8, 1.2]

  gaussian_noise_prob: 0.2
  gaussian_noise_std : 0.09

  gaussian_blur_prob : 0.2
  gaussian_blur_sigma: [0.5, 1.5]

  simulate_lowres_prob: 0.2
  simulate_lowres_zoom: [0.5, 1.0]


model:
  encoder_channels        : [64, 128, 256, 512, 512]
  encoder_blocks_per_stage: [2, 2, 2, 2, 2]
  decoder_blocks_per_stage: [2, 2, 2, 2]
  dropout                 : 0.0

  deep_supervision        : true

  stem_mode               : "dual"

  stem_fusion_mode        : "multi_stem_proj"

  aux_seg_supervision     : true

  aux_head_mode           : "conv"

  unet:
    backbone       : "resnet"
    block_type     : "basic"

    lift_2_5d_to_3d: false

    norm_type      : "batch"  # 'instance' | 'batch' | 'group'
    norm_groups    : 8
    activation     : "leakyrelu"  # 'leakyrelu' | 'gelu' | 'relu'
    attention_type : "none"
    skip_attention : false

    decoder_type   : "unet"  # 'unet' | 'unetpp' | 'unet3p'
    downsample_mode: "conv"  # 'conv' (学习) | 'maxpool'
    upsample_mode  : "trilinear"  # 'transpose' (学习) | 'trilinear'
    skip_mode      : "cat"  # 'cat' | 'add'

    drop_path_rate : 0.0
    selfattn:

      # ---- 内容寻址自注意力 SelfAttention 示例 ----
      # 推荐起点：只在瓶颈（最深级）放标准 softmax 多头自注意力——token 数最少、O(N²) 代价最低，
      # 提供真正的全局上下文（利于沿血管长程连通、抑制孤立假阳）。zero_init=true 保证初始为恒等
      # 残差、几乎不扰动现有基线。先验证有效，再考虑次深级用 linear 或开解码器侧。
      enabled       : true
      type          : "softmax"  # 全局默认类型（逐层写 1 时沿用）：'softmax'(放最深) | 'linear'(O(N),放次深)
      num_heads     : 4
      head_dim      : -1  # !=-1 时 num_heads = channels // head_dim
      zero_init     : true
      # 编码器逐 stage（长度=len(encoder_channels)=5；浅→深，末位=bottleneck）。默认仅瓶颈。
      # 每个元素可写：0/none=该层关；'softmax'=标准 QKV；'linear'=线性 QKV；1=沿用全局 selfattn_type。
      # 例：瓶颈 softmax + 次深 linear（分层选型）→ [0, 0, 0, linear, softmax]
      encoder_stages: [0, 0, 0, 0, softmax]
      # 解码器逐 level（长度=len(encoder_channels)-1=4；深→浅，取值同上）。默认关，作为第二轮对照。
      decoder_stages: [0, 0, 0, 0]
loss:
  name: "dice_focal"             # 'dice' | 'dice_ce' | 'dice_focal' | 'dice_focal_tversky' | ...
  compound_weights: [1.0, 1.0]

  class_weights : [1.0]       # 长度 = 前景类数 (不含 bg)
  region_weights: [1.0, 5.0]  # 按 label_values 全长 (含 bg)

  dice_smooth : 1.0e-5
  dice_squared: false

  focal_alpha: 0.5
  focal_gamma: 2.0

  tversky_alpha: 0.3
  tversky_beta : 0.7

  deep_supervision_weights: [1.0, 0.5, 0.25, 0.125]

  slice_loss_reduction: "per_volume"

  aux_supervision_weights: [0.5, 0.5]


train:
  epochs: 400

  optimizer   : "adamw"
  lr          : 1.0e-3
  weight_decay: 1.0e-4

  scheduler    : "cosine"
  warmup_epochs: 5
  warmup_lr    : 1.0e-6
  cosine_min_lr: 1.0e-6

  grad_accum_steps: 1
  grad_clip_norm  : 12.0

  use_amp  : true
  amp_dtype: "auto"

  compile_mode: "none"

  use_ema  : true
  ema_decay: 0.999

  output_dir      : "outputs/ves_resnet_selfattn"    ############################################################
  save_every      : 10
  save_best_criterion: "dice"
  surface_dice_tolerance: 1
  surface_dice_weight: 0.5
  save_best_preset: ""
  val_metric_mode: "medium"

  early_stopping: 0

  log_every: 10
  val_every: 1
  vis_every: 10

  seed: 42
  deterministic: false

  resume: ""

  pretrain: ""
  pretrain_strict: false
  pretrain_load_ema: false

predict:
  z_interleave_enabled   : false
  z_interleave_thresholds: [0.8, 1.2, 1.6, 2.0]
  z_interleave_factors   : [5, 4, 3, 2, 1]
  z_overlap : 0.5
  blend_mode: "gaussian"          # 'gaussian' | 'constant'
  batch_size: 2
  tta_flip  : true
  threshold : 0.5
  output_dir: ""
  save_probabilities: false